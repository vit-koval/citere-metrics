# Publishes ui/ to GitHub Pages.
#
# "Deploy from a branch" can only serve the repository root or /docs, and the site lives in ui/.
# Copying ui/ to docs/ would duplicate 31 MB and drift from what step_10_build_ui.py writes, so the
# directory stays where it is and this workflow uploads it.
name: Deploy UI to Pages

on:
  push:
    branches: [main]
    paths: ['ui/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui
      - id: deployment
        uses: actions/deploy-pages@v4
