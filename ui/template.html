<div class="wrap" id="app">

<script>/*GLOSSARY*/</script>
<script>/*PLATFORM_DATA*/</script>
<script>
"use strict";
const D = window.PLATFORM_DATA;
const DASH = D.dashboard, PTS = D.points, GROUPS = D.groups;
const KEYS = Object.keys(PTS);
const G = id => (window.GLOSSARY||{})[id] || null;
const gAttr = id => G(id) ? ` data-g="${id}"` : "";
const gLead = id => { const g=G(id); return g&&g.lead ? `<div class="lead">${escG(g.lead)}</div>` : ""; };
const escG = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const f1 = v => (v==null||v==="") ? "—" : (typeof v==="number" ? (Number.isInteger(v)?v.toLocaleString("en"):v.toFixed(1)) : esc(v));
const pct = v => v==null ? "—" : (v*1).toFixed(1)+"%";
const pct0 = v => v==null ? "—" : Math.round(v*1)+"%";
const shr = v => v==null ? "—" : (v*100).toFixed(1)+"%";        // pipeline shares stored 0–1
const shr0 = v => v==null ? "—" : Math.round(v*100)+"%";
const fmtK = v => v==null ? "—" : (v>=1000 ? Math.round(v/1000).toLocaleString("en")+"K" : Math.round(v).toString());
const ci = a => (a&&a.length===2) ? `${(+a[0]).toFixed(1)}–${(+a[1]).toFixed(1)}%` : "";
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const period = p => { const [y,m]=p.split("-"); return `${MONTHS[+m-1]} ${y}`; };
const SEVTAG = {good:"ok",warn:"warn",bad:"bad"};
const CONF = {high:"high",med:"medium",medium:"medium",low:"low"};
const themeName = t => t.includes(" · ") ? t.split(" · ").slice(1).join(" · ") : t;
const titleCause = (code, label, cause) => `<div class="title">${esc(label||code)}</div>${cause?`<div class="causeln">${esc(cause.label||cause.code)} · <span${gAttr("confidence")}>confidence ${esc(CONF[(cause.confidence||"").toLowerCase()]||cause.confidence||"—")}</span></div>`:""}`;
const groupById = Object.fromEntries(GROUPS.map(g=>[g.group_id,g]));
const campById = Object.fromEntries(D.campaigns.map(t=>[t.task_id,t]));
const heldById = Object.fromEntries((D.label_tasks_awaiting_signoff||[]).map(t=>[t.task_id,t]));
const NOT_TARGETED = new Set(D.meta.competitors_found_in_data||[]);   // entered the dictionary mid-cycle; R1/R2 were built against the GLP-1 set
const duelOf = name => (DASH.benchmarking.duel_verdict.by_competitor||{})[name] || null;
const ROUTES = ["visibility","competitors","sentiment","sources","priorities","actions","safety","map"];
const NAVL = {"":"Dashboard",visibility:"Visibility",competitors:"Competitors",sentiment:"Sentiment",sources:"Sources",priorities:"Priorities",actions:"Actions",safety:"Safety / Label",map:"Neural map"};
const M = DASH.meta;

// ---------------- header ----------------
document.getElementById("hTitle").textContent = `${M.brand} in AI answers`;
document.getElementById("hSub").textContent = `Cycle ${M.cycle}, ${period(M.period)}. ${M.market==="US/en"?"United States, English":M.market}. Against ${M.competitors.join(", ")}.`;
document.getElementById("hChips").innerHTML = `<span class="chip"><strong>${M.prompts.toLocaleString("en")}</strong> questions</span><span class="chip"><strong>${M.answers.toLocaleString("en")}</strong> answers</span><span class="chip"><strong>${M.surfaces}</strong> AI surfaces</span><button class="btn" type="button" onclick="window.print()">Export one-page PDF</button>`;
document.getElementById("nav").innerHTML = ["",...ROUTES].map(r=>`<a href="#/${r}" data-r="${r}">${NAVL[r]}</a>`).join("");

// ---------------- router ----------------
function parseHash(){
  const h = location.hash.replace(/^#\/?/,""); const [path,qs] = h.split("?"); const q = new URLSearchParams(qs||"");
  if(path.startsWith("point/")) return {route:"point", key:decodeURIComponent(path.slice(6)), q};
  return {route:path||"", q};
}
window.addEventListener("hashchange", render); render();
function render(){
  const {route,key,q} = parseHash();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.r===route));
  const v1=document.getElementById("view1"), v2=document.getElementById("view2"), v3=document.getElementById("view3");
  v1.innerHTML=v2.innerHTML=v3.innerHTML="";
  if(route==="map"){ openMapRoute(); return; } else { window.__closeMap && window.__closeMap(); }
  if(route==="") return level1(v1);
  if(route==="point") return level3(v3, key, q);
  const fn = {visibility:vVisibility, competitors:vCompetitors, sentiment:vSentiment, sources:vSources, priorities:vPriorities, actions:vActions, safety:vSafety}[route];
  if(fn) fn(v2, q); else v2.innerHTML = `<section class="tile">Unknown route.</section>`;
  window.scrollTo(0,0);
}

// ---------------- Level 1: the approved master screen with real data ----------------
function level1(el){
  const V=DASH.visibility, H=V.headline, B=DASH.benchmarking, S=DASH.sentiment, C=DASH.citations, P=DASH.prioritization, A=DASH.action_center, L=DASH.safety_label, BA=DASH.before_after;
  const lo=H.visibility_ci95[0], hi=H.visibility_ci95[1];
  const fam = V.by_model.map(d=>`<div>${esc(cap(d.model))}</div><div class="bar"><i class="t-us" style="width:${Math.min(100,Math.max(0,d.ai_brand_score))}%"></i></div><div>${(+d.ai_brand_score).toFixed(1)}</div>`).join("");
  const lead = B.leaderboard.slice(0,4).map(d=>`<tr><td>${esc(d.competitor)}</td><td class="n">${pct(d.impact)}</td><td class="n">${pct(d.impact_by_absence)}</td></tr>`).join("");
  const worst = L.by_surface.slice().sort((a,b)=>b.critical_share-a.critical_share)[0];
  const lightText = {red:"Dangerous errors found", yellow:"Warnings found", green:"No critical findings"}[L.traffic_light]||L.traffic_light;
  const r3 = S.top_negative_themes.filter(t=>t.run==="R3").slice(0,5).map(t=>`<tr><td>${esc(themeName(t.theme))}</td><td class="n">${pct0(t.pct_of_negative)}</td></tr>`).join("");
  const gap = C.gap_list.slice(0,4).map(g=>`<tr><td><a href="#/sources?domain=${encodeURIComponent(g.domain)}">${esc(g.domain)}</a></td><td class="n">${esc(g.subtype||g.owner)}</td><td class="n">gap ${g.gap_score}</td></tr>`).join("");
  const recs = P.recommendations.slice(0,3).map(r=>{ const g=groupById[r.group_id]; const o=r.owners[0]; return `<tr><td><span class="tag p${r.priority}">${r.priority}</span> <a href="#/priorities?group=${encodeURIComponent(r.group_id)}">${esc(r.group_id)}</a> — ${esc(o.owner)}<br><span class="note">Cause: ${esc(g.dominant_cause.code.toLowerCase())} in ${shr0(g.dominant_cause.share)} of points</span></td><td class="n">${fmtK(g.demand)}</td><td class="n">${shr0(g.gap)}</td><td class="n">${shr0(o.lever)}</td><td class="n">up to ${(+o.ceiling_pp).toFixed(0)} pp</td></tr>`; }).join("");
  const who = Object.entries(A.counters.by_who).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`<div>${esc(k)}</div><div>${v}</div>`).join("");
  const next = A.top3_open.map(t=>{ const c=campById[t.task_id]||{}; const e=t.impact.expected_pp; return `<tr><td><a href="#/actions">${esc(c.what||t.group_id+" → "+t.owner)}</a></td><td>${esc(t.who)}</td><td class="n">${e?`+${(+e[0]).toFixed(0)} to +${(+e[1]).toFixed(0)} pp`:"not estimated"}</td><td class="n"><span class="tag p1">open</span></td></tr>`; }).join("");
  el.innerHTML = `${gLead("screen_dashboard")}<div class="grid">
  <section class="tile c5" aria-label="Visibility Score" onclick="location.hash='#/visibility'">
    <h2${gAttr("visibility_score")}>Visibility Score <span>unbranded questions, API models</span></h2>${gLead("visibility_score")}
    <div class="row top">
      <div style="flex:1;min-width:210px">
        <div class="big"${gAttr("visibility_score")}>${pct(V.headline.visibility_pct)}</div>
        <div class="note">named when the patient asks about the category</div>
        <div class="ci" title="Wilson 95% interval"><b style="left:${lo}%;width:${(hi-lo).toFixed(2)}%"></b><i style="left:${H.visibility_pct}%"></i></div>
        <div class="note" style="margin-top:4px">95% interval ${ci(H.visibility_ci95)} · R1 unbranded questions</div>
        <div class="mid" style="margin-top:12px"${gAttr("named_any_scope")}>${pct0(V.named_any_scope_pct)}</div>
        <div class="note">named anywhere across all ${V.named_any_scope.points.toLocaleString("en")} tested questions — only the R1 set is unbranded</div>
      </div>
      <div style="flex:1;min-width:190px">
        <div class="kv"><div>AI Brand Score</div><div>${f1(H.ai_brand_score)} of 100</div><div>Average position when named</div><div>${f1(H.average_position)}</div><div>Active ingredient named, brand not</div><div>${pct0(H.inn_only_mention_pct)}</div></div>
        <div class="note" style="margin-top:6px">Change vs last cycle appears from cycle 2.</div>
      </div>
    </div>

// ---------------- shared: sortable table ----------------
function tbl(cols, rows, opts={}){
  const id = "t"+Math.random().toString(36).slice(2,8);
  const state = {k:opts.sortKey||null, dir:opts.sortDir||-1};
  const draw = () => {
    let r = rows.slice();
    if(state.k){ const c=cols.find(x=>x.k===state.k); const sv=c.sort||c.f; r.sort((a,b)=>{const x=sv(a),y=sv(b); return (x>y?1:x<y?-1:0)*state.dir;}); }
    const scroll = opts.scroll===undefined ? rows.length>12 : opts.scroll;
    const cls = c => [c.n?"n":"", c.c||""].filter(Boolean).join(" ");
    return `${scroll===true?`<div class="count">${rows.length.toLocaleString("en")} rows, scroll inside the table</div>`:""}<div class="tblwrap${scroll===true?" scroll":scroll==="tall"?" tall":""}"><table${opts.tableClass?` class="${opts.tableClass}"`:""}><thead><tr>${cols.map(c=>`<th data-k="${c.k}"${gAttr(c.g)} class="sort ${cls(c)}${state.k===c.k?" on":""}">${c.h}${state.k===c.k?(state.dir>0?" ↑":" ↓"):""}</th>`).join("")}</tr></thead><tbody>${r.map(row=>`<tr${opts.rowAttr?opts.rowAttr(row):""}>${cols.map(c=>`<td class="${cls(c)}">${c.f(row)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  };
  setTimeout(()=>{ const host=document.getElementById(id); if(!host) return; const bind=()=>{ host.querySelectorAll("th").forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(state.k===k) state.dir*=-1; else {state.k=k; state.dir=-1;} host.innerHTML=draw(); bind(); }); host.querySelectorAll("tr[data-href]").forEach(tr=>tr.onclick=()=>location.hash=tr.dataset.href); }; bind(); },0);
  return `<div id="${id}">${draw()}</div>`;
}
function sec(h, inner, note, sub, span, gid){ return `<section class="tile ${span||"c12"}"><h2${gAttr(gid)}>${h}${sub?` <span>${sub}</span>`:""}</h2>${gLead(gid)}${inner}${note?`<div class="note">${note}</div>`:""}</section>`; }
function kv(pairs){ return `<div class="kv">${pairs.map(([k,v])=>`<div>${k}</div><div>${v}</div>`).join("")}</div>`; }
function bar(v, cls){ return `<div class="bars"><div class="bar"><i class="${cls||"t-us"}" style="width:${Math.min(100,Math.max(0,v||0))}%"></i></div><span>${pct(v)}</span></div>`; }
function page(title, sub, gid){ return `<div style="margin-bottom:16px"><h2 class="page"${gAttr(gid)}>${title}</h2>${gLead(gid)}${sub?`<div class="subline">${sub}</div>`:""}</div>`; }

function pointTable(el, keys, opts={}){
  const st = {run:"",zone:"",topic:"",sub:"",fam:"",qt:"",stage:"",code:"",cause:"",sev:"",text:""};
  const all = keys.map(k=>PTS[k]);
  const uniq = (f) => [...new Set(all.map(f).flat().filter(Boolean))].sort();
  const sel = (id,label,vals) => `<select id="${id}"><option value="">${label}</option>${vals.map(v=>`<option>${esc(v)}</option>`).join("")}</select>`;
  el.innerHTML = `<div class="filters">${sel("pf_run","Run: all",uniq(p=>p.run))}${sel("pf_zone","Zone: all",uniq(p=>p.zone))}${sel("pf_topic","Topic: all",uniq(p=>p.topic))}${sel("pf_sub","Subtopic: all",uniq(p=>p.subtopic))}${sel("pf_fam","Family: all",uniq(p=>(p.metrics.by_model||[]).map(m=>m.model_family)))}${sel("pf_qt","Query type: all",uniq(p=>p.query_type))}${sel("pf_stage","Stage: all",uniq(p=>p.patient_stage))}${sel("pf_code","Code: all",uniq(p=>p.code))}${sel("pf_cause","Cause: all",uniq(p=>p.cause&&p.cause.code))}${sel("pf_sev","Sev: all",["good","warn","bad"])}<input type="search" id="pf_text" placeholder="Search questions or point id"><button class="btn ghost" id="pf_reset" type="button">Reset</button></div><p class="count" id="pf_cnt"></p><div id="pf_tbl"></div>`;
  const cols = [
    {k:"pid",h:"Point",g:"point_id",f:p=>`<span class="pid">${p.pid} · ${p.run}</span><div class="z">${p.class}</div>`,sort:p=>p.pid+p.run},

    {k:"topic",h:"Topic / subtopic",g:"topic_subtopic",c:"cw",f:p=>`${esc(p.topic)}${p.subtopic?`<div class="z">${esc(p.subtopic)}</div>`:""}`,sort:p=>p.topic+(p.subtopic||"")},
    {k:"sev",h:"Sev",g:"sev",c:"c",f:p=>`<span class="tag ${SEVTAG[p.sev]||"mute"}">${esc(p.sev)}</span>`,sort:p=>({bad:0,warn:1,good:2})[p.sev]},
    {k:"code",h:"What happened · why",g:"code",c:"cc",f:p=>titleCause(p.code,p.code_label,p.cause),sort:p=>p.code},
    {k:"pres",h:"Presence",g:"presence_share",f:p=>p.metrics.we_present_share==null?"—":bar(p.metrics.we_present_share*100),sort:p=>p.metrics.we_present_share??-1},
    {k:"pos",h:"Position",g:"avg_position",n:true,f:p=>f1(p.metrics.avg_position),sort:p=>p.metrics.avg_position??99},
    {k:"models",h:"Models, present / answers",g:"model_family",f:p=>`<div class="mchips">${famChips(p)}</div>`,sort:p=>p.metrics.answers},
    {k:"dem",h:"Demand /mo",g:"demand",n:true,f:p=>fmtK(p.demand.topic_demand),sort:p=>p.demand.topic_demand},
    {k:"rank",h:"Rank",g:"rank_score",n:true,f:p=>f1(p.point_rank_score),sort:p=>p.point_rank_score},
  ];
  const draw = () => {
    const q = st.text.toLowerCase();
    const list = all.filter(p => (!st.run||p.run===st.run)&&(!st.zone||p.zone===st.zone)&&(!st.topic||p.topic===st.topic)&&(!st.sub||p.subtopic===st.sub)&&(!st.fam||(p.metrics.by_model||[]).some(m=>m.model_family===st.fam))&&(!st.qt||p.query_type===st.qt)&&(!st.stage||p.patient_stage===st.stage)&&(!st.code||p.code===st.code)&&(!st.cause||(p.cause&&p.cause.code===st.cause))&&(!st.sev||p.sev===st.sev)&&(!q||p.question.toLowerCase().includes(q)||p.pid.toLowerCase().includes(q)));
    document.getElementById("pf_cnt").textContent = `${list.length.toLocaleString("en")} of ${all.length.toLocaleString("en")} points${opts.caption?" · "+opts.caption:""}`;
    window.__lastList = list.map(p=>p.pid+"|"+p.run);
    document.getElementById("pf_tbl").innerHTML = tbl(cols, list, {sortKey:opts.sortKey||null, sortDir:opts.sortDir||-1, tableClass:"pt-table", scroll:list.length>30?"tall":false, rowAttr:p=>` class="pt" data-href="#/point/${encodeURIComponent(p.pid+"|"+p.run)}"`});
  };
  Object.keys(st).forEach(k=>{ const e=document.getElementById("pf_"+k); if(e) e[k==="text"?"oninput":"onchange"]=ev=>{st[k]=ev.target.value;draw();}; });
  document.getElementById("pf_reset").onclick=()=>{Object.keys(st).forEach(k=>{st[k]="";const e=document.getElementById("pf_"+k);if(e)e.value="";});draw();};
  (opts.preset||[]).forEach(([k,v])=>{ st[k]=v; const e=document.getElementById("pf_"+k); if(e) e.value=v; });
  draw();
}

function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error(src+" not found")); document.head.appendChild(sc); }); }

const ANSWERS={}, ansPromise={};   // one gzip+base64 store per run: answers_R1.js … loaded only for the point's run
function loadAnswers(run){
  if(ansPromise[run]) return ansPromise[run];
  ansPromise[run] = loadScript("answers_"+run+".js").then(async()=>{ const b64=window["ANSWERS_B64_"+run]; const bin=Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); const ds=new DecompressionStream("gzip"); const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text(); Object.assign(ANSWERS, JSON.parse(text)); });
  return ansPromise[run];
}

    ${sec("Metrics", `<div class="row top"><div><div class="mid"${gAttr("presence_share")}>${m.we_present_share==null?"—":shr0(m.we_present_share)}<small>named</small></div></div><div><div class="mid">${f1(m.avg_position)}<small>position</small></div></div><div><div class="mid"${gAttr("answers_scored")}>${m.answers-m.answers_excluded}<small>scored answers</small></div><div class="note">${m.answers_excluded?m.answers_excluded+" excluded as unscoreable":"none excluded"}</div></div></div>` + tbl([{k:"f",h:"Family",g:"model_family",f:r=>esc(cap(r.model_family))},{k:"a",h:"Answers",g:"answers_scored",n:true,f:r=>r.answers},{k:"w",h:"We present",g:"presence_share",n:true,f:r=>r.we_present},{k:"p",h:"Position",g:"avg_position",n:true,f:r=>f1(r.position)},{k:"bs",h:"Brand sentiment",g:"answer_sentiment",n:true,f:r=>f1(r.brand_sentiment)},{k:"as",h:"Answer sentiment",g:"answer_sentiment",n:true,f:r=>f1(r.answer_sentiment)}], m.by_model) + `<div></div>` + kv([["INN only",shr(m.inn_only_share)],["Rank score",f1(p.point_rank_score)],["Competitors present",Object.entries(m.competitors_present||{}).map(([k,v])=>`${esc(k)} ${v}`).join(", ")||"none"],["Citations",`${m.citations.total} · owned ${m.citations.owned} · earned ${m.citations.earned} · institutional ${m.citations.institutional} · competitor ${m.citations.competitor} · adversarial ${m.citations.adversarial}`],...runspec]), "", "from the pipeline", "c7", "presence_share")}
    ${sec("Sources", `<div class="srclist">${(m.citations.top_domains||[]).map(d=>`<a href="#/sources?domain=${encodeURIComponent(d.domain)}">${esc(d.domain)} <span>×${d.n} · ${esc(d.owner)}${d.subtype?"/"+esc(d.subtype):""}</span></a>`).join("")||"<span class='note'>no citations</span>"}</div>` + (p.serp?`<dl class="dl" style="margin-top:10px"><dt>Google</dt><dd>${p.serp.our?"we rank #"+p.serp.our:"we are absent"}; competitor ${p.serp.comp?"#"+p.serp.comp:"absent"}</dd><dt>Occupiers</dt><dd>${(p.serp.occ||[]).map(esc).join(", ")||"—"}</dd><dt>Overlap</dt><dd>${p.serp.ov??"—"}%</dd></dl>`:"") + (p.inventory?`<dl class="dl" style="margin-top:10px"><dt>Our page</dt><dd>${esc(p.inventory.v)}${p.inventory.url?` · <a href="${esc(p.inventory.url)}" target="_blank" rel="noopener">${esc(p.inventory.url)}</a>`:""}</dd><dt>Missing</dt><dd>${esc(p.inventory.miss||"—")}</dd></dl>`:""), "", "top domains, SERP snapshot, inventory", "c5", "top_domain_citations")}
    ${sec("Diagnosis", `<div class="para">${(p.diagnosis_text||[]).map(s=>`<p>${esc(s)}</p>`).join("")}</div>`, "", "platform export", "c12", "cause")}

  document.getElementById("loadAns").onclick = async (ev) => {

    const arr = ANSWERS[key] || [];

// ---------------- glossary tooltips: hover, tap, click-away; never over the figure ----------------
const GT = document.createElement("div"); GT.id = "gtip"; document.body.appendChild(GT);
let gEl = null;
function showG(el){
  const g = G(el.dataset.g); if(!g) return;
  GT.innerHTML = `<b>${escG(g.title)}</b>${escG(g.text)}`; GT.classList.add("on"); gEl = el;
  const r = el.getBoundingClientRect(), w = GT.offsetWidth, h = GT.offsetHeight, pad = 8;
  let x = Math.min(Math.max(pad, r.left), Math.max(pad, innerWidth - w - pad));
  let y = r.bottom + pad;                                  // below the figure, so it never covers it
  if(y + h > innerHeight - pad) y = r.top - h - pad;                 // flip above rather than cover the figure
  y = Math.min(Math.max(pad, y), Math.max(pad, innerHeight - h - pad));
  GT.style.left = x + "px"; GT.style.top = y + "px";
}
function hideG(){ GT.classList.remove("on"); gEl = null; }
document.addEventListener("pointerover", e => { const el = e.target.closest && e.target.closest("[data-g]"); if(el && el !== gEl) showG(el); });
document.addEventListener("pointerout", e => { const el = e.target.closest && e.target.closest("[data-g]"); if(el && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("#gtip,[data-g]"))) hideG(); });
document.addEventListener("click", e => {
  const el = e.target.closest && e.target.closest("[data-g]");
  if(!el){ hideG(); return; }
  if(el.closest("[data-href]") || el.closest("a")) return;   // tapping inside a link or a row still navigates
  showG(el);
});
document.addEventListener("keydown", e => { if(e.key === "Escape") hideG(); });
window.addEventListener("hashchange", hideG);
addEventListener("scroll", () => { if(gEl) showG(gEl); }, true);

document.getElementById("nmClose").addEventListener("click", () => { if(location.hash.startsWith("#/map")) location.hash = "#/"; });
