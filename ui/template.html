<script>
"use strict";
const D = window.PLATFORM_DATA;
const DASH = D.dashboard, PTS = D.points, GROUPS = D.groups;
const KEYS = Object.keys(PTS);
const TASKS_ALL = (window.TASKS && window.TASKS.tasks) || [];      // tasks layer, spec v1 §4
const TASK_STATE = (window.TASKS && window.TASKS.state) || {};
const POINT_TASKS = (window.TASKS && window.TASKS.point_tasks) || {};   // §7: pid|run -> [task id]
const taskById = Object.fromEntries(TASKS_ALL.map(t=>[t.id,t]));
const LANE_A = TASKS_ALL.filter(t=>t.lane==="A"), LANE_B = TASKS_ALL.filter(t=>t.lane==="B"), LANE_C = TASKS_ALL.filter(t=>t.lane==="C");
function byWeek(a,b){ return (b.usd_per_week-a.usd_per_week)||(b.demand_mo-a.demand_mo)||a.id.localeCompare(b.id); }
// ---------------- revenue-at-risk layer (spec v2 §5) — display only ----------------
const PRICING = D.pricing || null, MONEY = D.money_totals || null;
const MONEY_NOTE = "(Google proxy, US \u00b7 estimate)";
const MONEY_TIP = "Floor = what the brand already pays per search visit. Mid = value of a new patient \u00d7 assumed conversion. "
  + "Ranking of groups and points does not depend on either value. Demand is Google search demand, a proxy for AI demand."
  + (PRICING ? "\n\nFloor: " + PRICING.sources.floor + "\n\nMid: " + PRICING.sources.mid
             + "\n\nAd spend: " + PRICING.sources.benchmark_ad_spend_usd_yr : "");
const _usdUnit = v => v >= 1e6 ? 1e6 : v >= 1000 ? 1000 : 1;
function usdRange(f, m){
  f = Math.round(f||0); m = Math.round(m||0);
  const u = _usdUnit(Math.max(f, m)), sfx = u===1e6 ? "M" : u===1000 ? "K" : "";
  const one = v => { const x = v/u; return u===1e6 ? (x<10 ? x.toFixed(1) : String(Math.round(x))) : String(Math.round(x)); };
  return "$" + one(f) + "\u2013" + one(m) + sfx;
}
const usdYr = a => usdRange(a[0]*12, a[1]*12);
function usdOne(v){ v=Math.round(v||0); const u=_usdUnit(v), sfx=u===1e6?"M":u===1000?"K":""; const x=v/u; return "$"+(u===1e6?(x<10?x.toFixed(1):Math.round(x)):Math.round(x))+sfx; }
function groupMoney(gid){
  if(!PRICING) return null;
  const g = groupById[gid]; if(!g) return null;
  return (g.pids||[]).reduce((a,k)=>{ const mo=(PTS[k]||{}).money;
    return (!mo||!mo.usd||mo.pf||mo.panel!=="api") ? a : [a[0]+mo.usd[0], a[1]+mo.usd[1]]; }, [0,0]);
}
const COMP_TIP = "Answers without Ozempic that name this brand. An answer naming several brands is split equally; "
  + "totals across brands never exceed the overall figure.";
const STAKE_TIP = "A point can belong to several groups \u2014 amounts are not additive. See the Revenue at risk tile for the total.";
const BY_COMP = Object.fromEntries(((MONEY&&MONEY.by_comp)||[]).map(r=>[r.brand, r.usd_mo]));
function compUsdYr(brand){ const v=BY_COMP[brand]; return v?usdYr(v):"\u2014"; }
function moneyTile(){
  if(!PRICING || !MONEY || !MONEY.api_usd_mo) return "";
  const yr=[MONEY.api_usd_mo[0]*12, MONEY.api_usd_mo[1]*12];
  const shr=v=>Math.round(v/PRICING.ad_spend_yr*100);
  const zt={}; LANE_A.forEach(t=>{ const z=t.zone||"\u2014"; (zt[z]=zt[z]||[0,0])[0]+=t.usd_yr[0]; zt[z][1]+=t.usd_yr[1]; });
  const top=Object.entries(zt).filter(x=>x[1][1]>0).sort((a,b)=>b[1][1]-a[1][1]).slice(0,3);
  const web=MONEY.web_usd_mo||[0,0];
  const names=(MONEY.portfolio||[]).join(", ");
  return `
  <section class="tile c5" aria-label="Revenue at risk" onclick="location.hash='#/priorities?sort=usd&panel=api&pf=0'">
    <h2>Revenue at risk <span>${MONEY_NOTE}</span></h2>
    <div class="big" title="${esc(MONEY_TIP)}">${usdRange(yr[0],yr[1])}<small> / yr</small></div>
    ${bar(shr(yr[1]))}
    <div class="note">${shr(yr[0])}%\u2013${shr(yr[1])}% of annual ${esc(M.brand)} ad budget (${usdOne(PRICING.ad_spend_yr)})</div>
    <div class="tblwrap"><table><tr><th>Top zones</th><th class="n">$ / yr</th></tr>${
      top.map(([z,v])=>`<tr><td><a href="#/priorities?zone=${encodeURIComponent(z)}">${esc(z)}</a></td><td class="n">${usdRange(v[0],v[1])}</td></tr>`).join("")}</table></div>
    <div class="note">Web surfaces (R4/R5): ${usdYr(web)} / yr \u2014 separate panel, not added</div>
    <div class="note">Portfolio queries excluded${names?` \u2014 ${esc(names)} ${MONEY.portfolio.length>1?"are":"is"} the client's own brand${MONEY.portfolio.length>1?"s":""}`:""}</div>
  </section>`;
}

// ---------------- shared: sortable table ----------------
function tbl(cols, rows, opts={}){
  const id = "t"+Math.random().toString(36).slice(2,8);
  const state = {k:opts.sortKey||null, dir:opts.sortDir||-1};
  const draw = () => {
    let r = rows.slice();
    if(state.k && cols.some(x=>x.k===state.k)){ const c=cols.find(x=>x.k===state.k); const sv=c.sort||c.f; r.sort((a,b)=>{const x=sv(a),y=sv(b); return (x>y?1:x<y?-1:0)*state.dir;}); }
    const scroll = opts.scroll===undefined ? rows.length>12 : opts.scroll;
    const cls = c => [c.n?"n":"", c.c||""].filter(Boolean).join(" ");
    return `${scroll===true?`<div class="count">${rows.length.toLocaleString("en")} rows, scroll inside the table</div>`:""}<div class="tblwrap${scroll===true?" scroll":scroll==="tall"?" tall":""}"><table${opts.tableClass?` class="${opts.tableClass}"`:""}><thead><tr>${cols.map(c=>`<th data-k="${c.k}"${gAttr(c.g)} class="sort ${cls(c)}${state.k===c.k?" on":""}">${c.h}${state.k===c.k?(state.dir>0?" ↑":" ↓"):""}</th>`).join("")}</tr></thead><tbody>${r.map(row=>`<tr${opts.rowAttr?opts.rowAttr(row):""}>${cols.map(c=>`<td class="${cls(c)}">${c.f(row)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  };
  setTimeout(()=>{ const host=document.getElementById(id); if(!host) return; const bind=()=>{ host.querySelectorAll("th").forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(state.k===k) state.dir*=-1; else {state.k=k; state.dir=-1;} host.innerHTML=draw(); bind(); }); host.querySelectorAll("tr[data-href]").forEach(tr=>tr.onclick=()=>location.hash=tr.dataset.href); }; bind(); },0);
  return `<div id="${id}">${draw()}</div>`;
}

function kv(pairs){ return `<div class="kv">${pairs.map(([k,v])=>`<div>${k}</div><div>${v}</div>`).join("")}</div>`; }
function bar(v, cls){ return `<div class="bars"><div class="bar"><i class="${cls||"t-us"}" style="width:${Math.min(100,Math.max(0,v||0))}%"></i></div><span>${pct(v)}</span></div>`; }

const ANSWERS={}, ansPromise={};   // one gzip+base64 store per run: answers_R1.js … loaded only for the point's run
function loadAnswers(run){
  if(ansPromise[run]) return ansPromise[run];
  ansPromise[run] = loadScript("answers_"+run+".js").then(async()=>{ const b64=window["ANSWERS_B64_"+run]; const bin=Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); const ds=new DecompressionStream("gzip"); const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text(); Object.assign(ANSWERS, JSON.parse(text)); });
  return ansPromise[run];
}

// ---------------- glossary tooltips: hover, tap, click-away; never over the figure ----------------
const GT = document.createElement("div"); GT.id = "gtip"; document.body.appendChild(GT);
let gEl = null;
function showG(el){
  const g = G(el.dataset.g); if(!g) return;
  GT.innerHTML = `<b>${escG(g.title)}</b>${escG(g.text)}`; GT.classList.add("on"); gEl = el;
  const r = el.getBoundingClientRect(), w = GT.offsetWidth, h = GT.offsetHeight, pad = 8;
  let x = Math.min(Math.max(pad, r.left), Math.max(pad, innerWidth - w - pad));
  let y = r.bottom + pad;                                  // below the figure, so it never covers it
  if(y + h > innerHeight - pad) y = r.top - h - pad;                 // flip above rather than cover the figure
  y = Math.min(Math.max(pad, y), Math.max(pad, innerHeight - h - pad));
  GT.style.left = x + "px"; GT.style.top = y + "px";
}
function hideG(){ GT.classList.remove("on"); gEl = null; }
document.addEventListener("pointerover", e => { const el = e.target.closest && e.target.closest("[data-g]"); if(el && el !== gEl) showG(el); });
document.addEventListener("pointerout", e => { const el = e.target.closest && e.target.closest("[data-g]"); if(el && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("#gtip,[data-g]"))) hideG(); });
document.addEventListener("click", e => {
  const el = e.target.closest && e.target.closest("[data-g]");
  if(!el){ hideG(); return; }
  if(el.closest("[data-href]") || el.closest("a")) return;   // tapping inside a link or a row still navigates
  showG(el);
});
document.addEventListener("keydown", e => { if(e.key === "Escape") hideG(); });
window.addEventListener("hashchange", hideG);
addEventListener("scroll", () => { if(gEl) showG(gEl); }, true);
