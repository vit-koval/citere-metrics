<script>
"use strict";
const D = window.PLATFORM_DATA;
const DASH = D.dashboard, PTS = D.points, GROUPS = D.groups;
const KEYS = Object.keys(PTS);
// ---------------- revenue-at-risk layer (spec v2 §5) — display only ----------------
const PRICING = D.pricing || null, MONEY = D.money_totals || null;
const MONEY_NOTE = "(Google proxy, US \u00b7 estimate)";
const MONEY_TIP = "Floor = what the brand already pays per search visit. Mid = value of a new patient \u00d7 assumed conversion. "
  + "Ranking of groups and points does not depend on either value. Demand is Google search demand, a proxy for AI demand."
  + (PRICING ? "\n\nFloor: " + PRICING.sources.floor + "\n\nMid: " + PRICING.sources.mid
             + "\n\nAd spend: " + PRICING.sources.benchmark_ad_spend_usd_yr : "");
const _usdUnit = v => v >= 1e6 ? 1e6 : v >= 1000 ? 1000 : 1;
function usdRange(f, m){
  f = Math.round(f||0); m = Math.round(m||0);
  const u = _usdUnit(Math.max(f, m)), sfx = u===1e6 ? "M" : u===1000 ? "K" : "";
  const one = v => { const x = v/u; return u===1e6 ? (x<10 ? x.toFixed(1) : String(Math.round(x))) : String(Math.round(x)); };
  return "$" + one(f) + "\u2013" + one(m) + sfx;
}
const usdYr = a => usdRange(a[0]*12, a[1]*12);
function usdOne(v){ v=Math.round(v||0); const u=_usdUnit(v), sfx=u===1e6?"M":u===1000?"K":""; const x=v/u; return "$"+(u===1e6?(x<10?x.toFixed(1):Math.round(x)):Math.round(x))+sfx; }
function groupMoney(gid){
  if(!PRICING) return null;
  const g = groupById[gid]; if(!g) return null;
  return (g.pids||[]).reduce((a,k)=>{ const mo=(PTS[k]||{}).money;
    return (!mo||!mo.usd||mo.pf||mo.panel!=="api") ? a : [a[0]+mo.usd[0], a[1]+mo.usd[1]]; }, [0,0]);
}
function moneyTile(){
  if(!PRICING || !MONEY || !MONEY.api_usd_mo) return "";
  const yr=[MONEY.api_usd_mo[0]*12, MONEY.api_usd_mo[1]*12];
  const shr=v=>Math.round(v/PRICING.ad_spend_yr*100);
  const seen=new Set(), gids=[];
  (DASH.prioritization.recommendations||[]).forEach(r=>{ if(!seen.has(r.group_id)){ seen.add(r.group_id); gids.push(r.group_id); } });
  const top=gids.map(g=>[g,groupMoney(g)]).filter(x=>x[1]&&x[1][1]>0).sort((a,b)=>b[1][1]-a[1][1]).slice(0,3);
  const web=MONEY.web_usd_mo||[0,0];
  const names=(MONEY.portfolio||[]).join(", ");
  return `
  <section class="tile c5" aria-label="Revenue at risk" onclick="location.hash='#/priorities?sort=usd&panel=api&pf=0'">
    <h2>Revenue at risk <span>${MONEY_NOTE}</span></h2>
    <div class="big" title="${esc(MONEY_TIP)}">${usdRange(yr[0],yr[1])}<small> / yr</small></div>
    ${bar(shr(yr[1]))}
    <div class="note">${shr(yr[0])}%\u2013${shr(yr[1])}% of annual ${esc(M.brand)} ad budget (${usdOne(PRICING.ad_spend_yr)})</div>
    <div class="tblwrap"><table><tr><th>Top groups</th><th class="n">$ / yr</th></tr>${
      top.map(([g,v])=>`<tr><td>${esc(g)}</td><td class="n">${usdYr(v)}</td></tr>`).join("")}</table></div>
    <div class="note">Web surfaces (R4/R5): ${usdYr(web)} / yr \u2014 separate panel, not added</div>
    <div class="note">Portfolio queries excluded${names?` \u2014 ${esc(names)} ${MONEY.portfolio.length>1?"are":"is"} the client's own brand${MONEY.portfolio.length>1?"s":""}`:""}</div>
  </section>`;
}
function moneySum(list){ return list.reduce((s,p)=>{ const u=(p.money||{}).usd; return (p.money&&p.money.pf)||!u ? s : [s[0]+u[0], s[1]+u[1]]; }, [0,0]); }
const G = id => (window.GLOSSARY||{})[id] || null;
const gAttr = id => G(id) ? ` data-g="${id}"` : "";
const gLead = id => { const g=G(id); return g&&g.lead ? `<div class="lead">${escG(g.lead)}</div>` : ""; };
const escG = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const f1 = v => (v==null||v==="") ? "—" : (typeof v==="number" ? (Number.isInteger(v)?v.toLocaleString("en"):v.toFixed(1)) : esc(v));
const pct = v => v==null ? "—" : (v*1).toFixed(1)+"%";
const pct0 = v => v==null ? "—" : Math.round(v*1)+"%";
const shr = v => v==null ? "—" : (v*100).toFixed(1)+"%";        // pipeline shares stored 0–1
const shr0 = v => v==null ? "—" : Math.round(v*100)+"%";
const fmtK = v => v==null ? "—" : (v>=1000 ? Math.round(v/1000).toLocaleString("en")+"K" : Math.round(v).toString());
const ci = a => (a&&a.length===2) ? `${(+a[0]).toFixed(1)}–${(+a[1]).toFixed(1)}%` : "";
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const period = p => { const [y,m]=p.split("-"); return `${MONTHS[+m-1]} ${y}`; };
const SEVTAG = {good:"ok",warn:"warn",bad:"bad"};
const CONF = {high:"high",med:"medium",medium:"medium",low:"low"};
const themeName = t => t.includes(" · ") ? t.split(" · ").slice(1).join(" · ") : t;
const titleCause = (code, label, cause) => `<div class="title">${esc(label||code)}</div>${cause?`<div class="causeln">${esc(cause.label||cause.code)} · <span${gAttr("confidence")}>confidence ${esc(CONF[(cause.confidence||"").toLowerCase()]||cause.confidence||"—")}</span></div>`:""}`;
const groupById = Object.fromEntries(GROUPS.map(g=>[g.group_id,g]));
const campById = Object.fromEntries(D.campaigns.map(t=>[t.task_id,t]));
const heldById = Object.fromEntries((D.label_tasks_awaiting_signoff||[]).map(t=>[t.task_id,t]));
const NOT_TARGETED = new Set(D.meta.competitors_found_in_data||[]);   // entered the dictionary mid-cycle; R1/R2 were built against the GLP-1 set

const ROUTES = ["visibility","competitors","sentiment","sources","priorities","actions","safety","map"];

const TASK_STORE = "citere_task_state";
const readTaskState = () => { try { return JSON.parse(localStorage.getItem(TASK_STORE) || "{}"); } catch(e){ return {}; } };
const writeTaskState = o => { try { localStorage.setItem(TASK_STORE, JSON.stringify(o)); } catch(e){} };
const TASK_COLS = [["open","Open"],["in_progress","In progress"],["done","Done"],["dismissed","Dismissed"]];
let __campIndex = null;
function campaignsByCard(){                       // fix-card id -> the campaigns that reference it
  if(__campIndex) return __campIndex;
  __campIndex = new Map();
  D.campaigns.concat(D.label_tasks_awaiting_signoff || []).forEach(t => {
    (t.fix_card_refs || []).forEach(r => {
      const id = r.pid_run + "#" + r.fix_idx;
      if(!__campIndex.has(id)) __campIndex.set(id, []);
      __campIndex.get(id).push(t);
    });
  });
  return __campIndex;
}
function makeTask(pid_run, fix_idx, cs, st){      // one fix card, with whatever campaign context it has
  const id = pid_run + "#" + fix_idx, s = st[id] || {};
  return {id, pid_run, fix_idx, point: PTS[pid_run], card: PTS[pid_run].fixes[fix_idx], campaigns: cs,
          group_id: cs.length ? cs[0].group_id : PTS[pid_run].group_id,
          owners: [...new Set(cs.map(t => t.owner))],
          priority: cs.length ? Math.max(...cs.map(t => t.priority || 0)) : ((groupById[PTS[pid_run].group_id] || {}).priority || 0),
          awaiting: cs.length ? cs.every(t => t.awaiting_label_signoff) : false,
          status: s.status || "open", assignee: s.assignee || null, sent_at: s.sent_at || null,
          dismiss_reason: s.dismiss_reason || null, touched: !!st[id]};
}
function buildTasks(){
  // window.__taskById lets a table row find its task when it opens its detail row
  const st = readTaskState();
  return [...campaignsByCard().entries()].map(([id, cs]) => {
    const i = id.lastIndexOf("#");
    return makeTask(id.slice(0, i), Number(id.slice(i + 1)), cs, st);
  }).sort((a,b) => (b.priority - a.priority) || a.id.localeCompare(b.id));
}
function tasksForPoint(key){                      // every client fix card on one question, as real tasks
  const idx = campaignsByCard(), st = readTaskState();
  return (PTS[key].fixes || []).map((c, i) => ({c, i}))
    .filter(x => x.c.audience === "client")
    .map(x => makeTask(key, x.i, idx.get(key + "#" + x.i) || [], st));
}
function indexTasks(list){ window.__taskById = Object.fromEntries(list.map(t=>[t.id, t])); return list; }
function taskAct(ids, kind){
  const cur = readTaskState(); let assignee = null, why = null;
  if(kind==="assign"){ assignee = prompt("Assign to"); if(!assignee) return; }
  if(kind==="dismiss"){ why = prompt("Dismiss reason (required)"); if(!why) return; }
  ids.forEach(id => {
    const e = cur[id] || {};
    if(kind==="agent"){ e.sent_at = new Date().toISOString(); e.status = "in_progress"; }
    if(kind==="assign"){ e.assignee = assignee; if(e.status !== "done") e.status = "in_progress"; }
    if(kind==="done"){ e.status = "done"; }
    if(kind==="dismiss"){ e.status = "dismissed"; e.dismiss_reason = why; }
    e.at = new Date().toISOString(); cur[id] = e;
  });
  writeTaskState(cur); render();
}

const taskMeta = c => `<span class="tt" title="${esc(c.agent||"")}"${gAttr("task_type")}>${esc(c.task_type||"")}</span>

const taskPointLink = t => `<a class="fpt-l" href="#/point/${encodeURIComponent(t.pid_run)}">${esc(t.pid_run)}</a> <span class="q">${esc((t.point.question||"").slice(0,90))}</span>`;

function taskListHTML(list, dedupe, opts){
  if(!list.length) return '<div class="dedup">none</div>';
  if(!dedupe) return list.map(t=>taskCardHTML(t, opts)).join("");
  const m = new Map();
  list.forEach(t => { if(!m.has(t.card.action)) m.set(t.card.action, []); m.get(t.card.action).push(t); });
  return [...m.entries()].sort((a,b)=>b[1].length-a[1].length)
    .map(([a,its]) => its.length>1 ? taskGroupCardHTML(a, its, opts) : taskCardHTML(its[0], opts)).join("");
}
const taskSwallow = ev => !!(ev.target.closest && ev.target.closest("button,a,select,input,textarea"));
function toggleTaskDetail(id, btn){
  const box = document.getElementById("td_" + id.replace(/[^a-zA-Z0-9]/g, "")); if(!box) return;
  box.classList.toggle("hide");
  const open = !box.classList.contains("hide");
  if(btn) btn.textContent = open ? "Details ▴" : "Details ▾";
  const card = box.closest(".kcard"); if(card) card.classList.toggle("open", open);
}
function wireTasks(root){
  root.querySelectorAll("[data-a]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); taskAct(b.dataset.ids.split(","), b.dataset.a); });
  root.querySelectorAll("[data-fl]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); const box=document.getElementById(b.dataset.fl); box.classList.toggle("hide");
    b.textContent = `Show the ${box.querySelectorAll(".fpt").length} tasks ` + (box.classList.contains("hide") ? "▾" : "▴"); });
  root.querySelectorAll("[data-td]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); toggleTaskDetail(b.dataset.td, b); });
  // the card body opens the same detail; buttons and links inside it keep their own behaviour
  root.querySelectorAll(".kcard[data-id], .kcard.grouped").forEach(card=>{
    const b = card.querySelector("[data-td]"); if(!b) return;
    card.onclick = ev => { if(taskSwallow(ev)) return; toggleTaskDetail(b.dataset.td, b); };
  });
  // table rows open a detail row underneath
  root.querySelectorAll("tr.task").forEach(tr=>{
    tr.onclick = ev => {
      if(taskSwallow(ev)) return;
      const next = tr.nextElementSibling;
      if(next && next.classList.contains("taskdetail")){ next.remove(); tr.classList.remove("open"); return; }
      const t = (window.__taskById || {})[tr.dataset.id]; if(!t) return;
      const det = document.createElement("tr"); det.className = "taskdetail";
      det.innerHTML = `<td colspan="${tr.children.length}"><div class="inner">${taskDetailHTML(t)}</div></td>`;
      tr.after(det); tr.classList.add("open");
      det.querySelectorAll("a").forEach(a=>a.onclick=e=>e.stopPropagation());
    };
  });
  root.querySelectorAll("a").forEach(a=>a.onclick=ev=>ev.stopPropagation());
}
function groupTaskStats(gid, tasks){
  const l = tasks.filter(t => t.group_id === gid);
  const by = {}; TASK_COLS.forEach(([k]) => by[k] = l.filter(t => t.status === k).length);
  return {n: l.length, by, list: l};
}

// ---------------- router ----------------
function parseHash(){
  const h = location.hash.replace(/^#\/?/,""); const [path,qs] = h.split("?"); const q = new URLSearchParams(qs||"");
  if(path.startsWith("point/")) return {route:"point", key:decodeURIComponent(path.slice(6)), q};
  return {route:path||"", q};
}
window.addEventListener("hashchange", render); render();
function render(){
  const {route,key,q} = parseHash();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.r===route));
  const v1=document.getElementById("view1"), v2=document.getElementById("view2"), v3=document.getElementById("view3");
  v1.innerHTML=v2.innerHTML=v3.innerHTML="";
  if(route==="map"){ openMapRoute(); return; } else { window.__closeMap && window.__closeMap(); }
  if(route==="") return level1(v1);
  if(route==="point") return level3(v3, key, q);
  const fn = {visibility:vVisibility, competitors:vCompetitors, sentiment:vSentiment, sources:vSources, priorities:vPriorities, actions:vActions, safety:vSafety}[route];
  if(fn) fn(v2, q); else v2.innerHTML = `<section class="tile">Unknown route.</section>`;
  window.scrollTo(0,0);
}

// ---------------- shared: sortable table ----------------
function tbl(cols, rows, opts={}){
  const id = "t"+Math.random().toString(36).slice(2,8);
  const state = {k:opts.sortKey||null, dir:opts.sortDir||-1};
  const draw = () => {
    let r = rows.slice();
    if(state.k && cols.some(x=>x.k===state.k)){ const c=cols.find(x=>x.k===state.k); const sv=c.sort||c.f; r.sort((a,b)=>{const x=sv(a),y=sv(b); return (x>y?1:x<y?-1:0)*state.dir;}); }
    const scroll = opts.scroll===undefined ? rows.length>12 : opts.scroll;
    const cls = c => [c.n?"n":"", c.c||""].filter(Boolean).join(" ");
    return `${scroll===true?`<div class="count">${rows.length.toLocaleString("en")} rows, scroll inside the table</div>`:""}<div class="tblwrap${scroll===true?" scroll":scroll==="tall"?" tall":""}"><table${opts.tableClass?` class="${opts.tableClass}"`:""}><thead><tr>${cols.map(c=>`<th data-k="${c.k}"${gAttr(c.g)} class="sort ${cls(c)}${state.k===c.k?" on":""}">${c.h}${state.k===c.k?(state.dir>0?" ↑":" ↓"):""}</th>`).join("")}</tr></thead><tbody>${r.map(row=>`<tr${opts.rowAttr?opts.rowAttr(row):""}>${cols.map(c=>`<td class="${cls(c)}">${c.f(row)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  };
  setTimeout(()=>{ const host=document.getElementById(id); if(!host) return; const bind=()=>{ host.querySelectorAll("th").forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(state.k===k) state.dir*=-1; else {state.k=k; state.dir=-1;} host.innerHTML=draw(); bind(); }); host.querySelectorAll("tr[data-href]").forEach(tr=>tr.onclick=()=>location.hash=tr.dataset.href); }; bind(); },0);
  return `<div id="${id}">${draw()}</div>`;
}
function sec(h, inner, note, sub, span, gid){ return `<section class="tile ${span||"c12"}"><h2${gAttr(gid)}>${h}${sub?` <span>${sub}</span>`:""}</h2>${gLead(gid)}${inner}${note?`<div class="note">${note}</div>`:""}</section>`; }
function kv(pairs){ return `<div class="kv">${pairs.map(([k,v])=>`<div>${k}</div><div>${v}</div>`).join("")}</div>`; }
function bar(v, cls){ return `<div class="bars"><div class="bar"><i class="${cls||"t-us"}" style="width:${Math.min(100,Math.max(0,v||0))}%"></i></div><span>${pct(v)}</span></div>`; }
function page(title, sub, gid){ return `<div style="margin-bottom:16px"><h2 class="page"${gAttr(gid)}>${title}</h2>${gLead(gid)}${sub?`<div class="subline">${sub}</div>`:""}</div>`; }

     f:p=>{ const mo=p.money||{}; if(!mo.usd) return "\u2014";

const ANSWERS={}, ansPromise={};   // one gzip+base64 store per run: answers_R1.js … loaded only for the point's run
function loadAnswers(run){
  if(ansPromise[run]) return ansPromise[run];
  ansPromise[run] = loadScript("answers_"+run+".js").then(async()=>{ const b64=window["ANSWERS_B64_"+run]; const bin=Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); const ds=new DecompressionStream("gzip"); const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text(); Object.assign(ANSWERS, JSON.parse(text)); });
  return ansPromise[run];
}

    ${sec("Tasks from this question", `<div class="lead">The same cards as the Action Center: open one for its detail, or act on it here.</div><div id="ptTasks">${taskListHTML(tasksForPoint(key), false, {acLink:true, showStatus:true})}</div>`, "", `client · ${p.fixes.filter(c=>c.audience==="client").length}`, "c12", "open_tasks")}
    <section class="tile c12"><button class="collapse" type="button" onclick="document.getElementById('cit2').classList.toggle('hide')">Citere monitoring (${p.fixes.filter(c=>c.audience==="citere").length} TRACK cards)</button><div id="cit2" class="hide">${p.fixes.filter(c=>c.audience==="citere").map(c=>fixCard(c)).join("")}</div></section>
  </div>`;
  wireTasks(document.getElementById("ptTasks"));
  const openTask = q && q.get("open");                    // #/point/<key>?open=<fix index> opens that task here
  if(openTask){
    const card = document.querySelector(`#ptTasks .kcard[data-id="${CSS.escape(key + "#" + openTask)}"]`);
    if(card){ card.classList.add("hit"); card.click(); }
  }
  document.getElementById("loadAns").onclick = async (ev) => {
    ev.target.textContent = "Loading…";
    let err=null; try{ await loadAnswers(p.run); }catch(e){ err=e; }
    const arr = ANSWERS[key] || [];
    document.getElementById("ansBox").innerHTML = arr.length ? arr.map(a=>`<div class="ans"><div class="ah" onclick="this.nextElementSibling.classList.toggle('hide')"><span class="who">${esc(a.model)}</span><span class="m">repeat ${a.repeat_idx}</span>${a.excluded?`<span class="tag bad">excluded · ${esc(a.exclude_reason)}</span>`:""}<span class="m">${a.citations.length} citations</span></div><div class="hide"><div class="ab">${esc(a.answer_clean)}</div><div class="cits">${a.citations.map(c=>`<a href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(c.owner)}">${esc(c.domain)}</a>`).join("")}</div></div></div>`).join("") : `<div class="note">No answer texts available (${err?esc(err.message):"key absent in answers_"+esc(p.run)+".js"}).</div>`;
    ev.target.textContent = `${arr.length} answers loaded`;
  };
}

// ---------------- glossary tooltips: hover, tap, click-away; never over the figure ----------------
const GT = document.createElement("div"); GT.id = "gtip"; document.body.appendChild(GT);
let gEl = null;
function showG(el){
  const g = G(el.dataset.g); if(!g) return;
  GT.innerHTML = `<b>${escG(g.title)}</b>${escG(g.text)}`; GT.classList.add("on"); gEl = el;
  const r = el.getBoundingClientRect(), w = GT.offsetWidth, h = GT.offsetHeight, pad = 8;
  let x = Math.min(Math.max(pad, r.left), Math.max(pad, innerWidth - w - pad));
  let y = r.bottom + pad;                                  // below the figure, so it never covers it
  if(y + h > innerHeight - pad) y = r.top - h - pad;                 // flip above rather than cover the figure
  y = Math.min(Math.max(pad, y), Math.max(pad, innerHeight - h - pad));
  GT.style.left = x + "px"; GT.style.top = y + "px";
}
function hideG(){ GT.classList.remove("on"); gEl = null; }
document.addEventListener("pointerover", e => { const el = e.target.closest && e.target.closest("[data-g]"); if(el && el !== gEl) showG(el); });
document.addEventListener("pointerout", e => { const el = e.target.closest && e.target.closest("[data-g]"); if(el && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("#gtip,[data-g]"))) hideG(); });
document.addEventListener("click", e => {
  const el = e.target.closest && e.target.closest("[data-g]");
  if(!el){ hideG(); return; }
  if(el.closest("[data-href]") || el.closest("a")) return;   // tapping inside a link or a row still navigates
  showG(el);
});
document.addEventListener("keydown", e => { if(e.key === "Escape") hideG(); });
window.addEventListener("hashchange", hideG);
addEventListener("scroll", () => { if(gEl) showG(gEl); }, true);

window.__nmGoPoint = pid => { location.hash = "#/point/"+encodeURIComponent(PID2KEY[pid]||pid); };
window.__nmGoFix = pid => { location.hash = "#/actions"; };
document.getElementById("nmClose").addEventListener("click", () => { if(location.hash.startsWith("#/map")) location.hash = "#/"; });
</script>
