<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citere · Ozempic · cycle 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!--LEGACY_STYLE-->
<style>
/* ---- additions on top of the legacy tokens ---- */
.nav{display:flex;gap:4px;margin:14px 0 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nav a{color:var(--ink2);font:600 13px "IBM Plex Sans";padding:9px 13px;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.nav a.on{color:var(--accent);border-bottom-color:var(--accent)}
.hdr{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.hdr .meta{color:var(--muted);font:500 11.5px "IBM Plex Mono",monospace}
.pbtn{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--accent);font:600 12px "IBM Plex Sans";border-radius:6px;padding:7px 12px;cursor:pointer}
.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}
@media(max-width:1100px){.grid8{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid8{grid-template-columns:1fr}}
.tile2{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;min-height:150px;display:flex;flex-direction:column;gap:4px}
.tile2:hover{border-color:var(--accent)}
.tile2.off{cursor:default;opacity:.7}
.tile2 h4{margin:0 0 4px;font:600 10px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile2 .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile2 .ci{font:500 11px "IBM Plex Mono",monospace;color:var(--muted)}
.tile2 .ln{font-size:12px;color:var(--ink2);line-height:1.45}
.tile2 .ln b{color:var(--ink)}
.light{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.light.red{background:var(--crit)} .light.yellow{background:var(--warn)} .light.green{background:var(--good)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.sec h3{margin:0 0 10px;font:600 11px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec .note{font-size:12px;color:var(--muted);margin:6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
table.t2{min-width:0;font-size:12.5px}
table.t2 th{cursor:pointer;user-select:none}
table.t2 th.sorted{color:var(--accent)}
.bar2{height:6px;background:var(--na-bg);border-radius:3px;position:relative;overflow:hidden;min-width:90px}
.bar2 i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.title{font-weight:700;font-size:13px}
.causeln{color:var(--muted);font-size:11.5px;margin-top:2px}
.causeln .cf{font-family:"IBM Plex Mono",monospace;font-size:10.5px}
.tag{display:inline-block;border-radius:3px;padding:1px 6px;font:600 10px/1.7 "IBM Plex Mono",monospace;letter-spacing:.04em;margin-right:4px}
.tag.cl{background:var(--accent-soft);color:var(--accent)} .tag.ci{background:var(--na-bg);color:var(--na)}
.tag.pend{background:var(--na-bg);color:var(--na)} .tag.conf{background:var(--good-bg);color:var(--good)}
.tag.dang{background:var(--crit-bg);color:var(--crit)} .tag.inc{background:var(--warn-bg);color:var(--warn)}
.badge-ls{font:600 10px "IBM Plex Mono",monospace;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:1px 6px;margin-left:6px}
.pt-detail{display:grid;grid-template-columns:1.3fr 1fr;gap:18px 26px}
@media(max-width:900px){.pt-detail{grid-template-columns:1fr}}
.ans{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--card)}
.ans .ah{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font:600 12px "IBM Plex Sans";cursor:pointer;flex-wrap:wrap}
.ans .ah .mono{color:var(--muted);font-weight:500}
.ans .ab{padding:10px 14px;white-space:pre-wrap;font-size:12.5px;line-height:1.6;color:var(--ink)}
.ans .cits{padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:4px}
.ans .cits a{border:1px solid var(--line);border-radius:4px;padding:1px 6px;font:500 10.5px "IBM Plex Mono",monospace;color:var(--ink2);text-decoration:none;background:var(--card2)}
.excl{background:var(--crit-bg);color:var(--crit);font:600 10px "IBM Plex Mono",monospace;border-radius:3px;padding:1px 6px}
.prevnext{display:flex;gap:8px;margin:0 0 10px}
.prevnext a{color:var(--accent);text-decoration:none;font:600 12px "IBM Plex Sans"}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px}
.kv b{font-variant-numeric:tabular-nums}
.sub-row td{background:var(--card2);font-size:12px}
.status-sel{border:1px solid var(--line);border-radius:5px;padding:3px 6px;font:500 11.5px "IBM Plex Sans";background:var(--card);color:var(--ink)}
.collapse{color:var(--accent);cursor:pointer;font:600 12px "IBM Plex Sans";background:none;border:0;padding:6px 0}
@media print{ .nav,.pbtn,.filters,#view2,#view3{display:none!important} body{background:#fff} .tile2{break-inside:avoid;border-color:#999} }
</style></head><body>
<div class="wrap" id="app">
  <div class="hdr"><div><div class="kicker">CITERE · MASTER DASHBOARD · <span id="hCycle"></span></div><h1 id="hBrand"></h1><div class="meta" id="hMeta"></div></div>
    <button class="pbtn" onclick="window.print()">Export one-page PDF</button></div>
  <nav class="nav" id="nav"></nav>
  <div id="view1"></div>
  <div id="view2"></div>
  <div id="view3"></div>
</div>
<!--LEGACY_MAP_HTML-->
<script>/*PLATFORM_DATA*/</script>
<script>
"use strict";
const D = window.PLATFORM_DATA;
const DASH = D.dashboard, PTS = D.points, GROUPS = D.groups;
const KEYS = Object.keys(PTS);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const f1 = v => (v==null||v==="") ? "—" : (typeof v==="number" ? (Number.isInteger(v)?v.toLocaleString("en"):v.toFixed(1)) : esc(v));
const pct = v => v==null ? "—" : (v*1).toFixed(1)+"%";
const shr = v => v==null ? "—" : (v*100).toFixed(1)+"%";   // share 0–1 stored by pipeline → percent display
const ci = a => (a&&a.length===2) ? `[${(+a[0]).toFixed(1)}–${(+a[1]).toFixed(1)}]` : "";
const SEV = {good:["Good","s-good"],warn:["Warn","s-warn"],bad:["Bad","s-bad"]};
const CONF = {high:"high",med:"med",medium:"med",low:"low"};
const titleCause = (code, label, cause) => `<div class="title">${esc(label||code)}</div>${cause?`<div class="causeln">${esc(cause.label||cause.code)} · <span class="cf">confidence: ${esc(CONF[(cause.confidence||"").toLowerCase()]||cause.confidence||"—")}</span></div>`:""}`;
const groupById = Object.fromEntries(GROUPS.map(g=>[g.group_id,g]));
const ROUTES = ["visibility","competitors","sentiment","sources","priorities","actions","safety","map"];
const NAVL = {"":"Dashboard",visibility:"Visibility",competitors:"Competitors",sentiment:"Sentiment",sources:"Sources",priorities:"Priorities",actions:"Actions",safety:"Safety / Label",map:"Neural map ✦"};

// ---------------- header ----------------
document.getElementById("hCycle").textContent = `CYCLE ${DASH.meta.cycle} · ${DASH.meta.period}`;
document.getElementById("hBrand").textContent = `${DASH.meta.brand} in AI answers`;
document.getElementById("hMeta").textContent = `${DASH.meta.prompts.toLocaleString("en")} prompts · ${DASH.meta.answers.toLocaleString("en")} answers · ${DASH.meta.surfaces} surfaces · ${DASH.meta.market} · pipeline ${DASH.meta.pipeline_version}`;
document.getElementById("nav").innerHTML = ["",...ROUTES].map(r=>`<a href="#/${r}" data-r="${r}">${NAVL[r]}</a>`).join("");

// ---------------- router ----------------
function parseHash(){
  const h = location.hash.replace(/^#\/?/,""); const [path,qs] = h.split("?"); const q = new URLSearchParams(qs||"");
  if(path.startsWith("point/")) return {route:"point", key:decodeURIComponent(path.slice(6)), q};
  return {route:path||"", q};
}
window.addEventListener("hashchange", render); render();
function render(){
  const {route,key,q} = parseHash();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.r===route));
  const v1=document.getElementById("view1"), v2=document.getElementById("view2"), v3=document.getElementById("view3");
  v1.innerHTML=v2.innerHTML=v3.innerHTML="";
  if(route==="map"){ openMapRoute(); return; } else { window.__closeMap && window.__closeMap(); }
  if(route==="") return level1(v1);
  if(route==="point") return level3(v3, key, q);
  const fn = {visibility:vVisibility, competitors:vCompetitors, sentiment:vSentiment, sources:vSources, priorities:vPriorities, actions:vActions, safety:vSafety}[route];
  if(fn) fn(v2, q); else v2.innerHTML = `<div class="sec">Unknown route.</div>`;
  window.scrollTo(0,0);
}

// ---------------- Level 1 ----------------
function level1(el){
  const V=DASH.visibility.headline, B=DASH.benchmarking, S=DASH.sentiment, C=DASH.citations, P=DASH.prioritization, A=DASH.action_center, L=DASH.safety_label, BA=DASH.before_after;
  const first = !BA.available;
  const tile = (h, body, href, off) => `<div class="tile2${off?" off":""}" ${href&&!off?`onclick="location.hash='${href}'"`:""}><h4>${h}</h4>${body}${first?`<div class="ci">first cycle — no delta</div>`:""}</div>`;
  el.innerHTML = `<div class="grid8">
    ${tile("Visibility Score", `<div class="big">${pct(V.visibility_pct)}</div><div class="ci">Wilson 95% ${ci(V.visibility_ci95)}</div><div class="ln">avg position <b>${f1(V.average_position)}</b> · AI Brand Score <b>${f1(V.ai_brand_score)}</b><br>INN-only mention <b>${pct(V.inn_only_mention_pct)}</b> · ${esc(DASH.visibility.scope_note)}</div>`, "#/visibility")}
    ${tile("Competitive Benchmarking", `<div class="big">${pct(B.overall.win_rate)}</div><div class="ci">win rate ${ci(B.overall.win_rate_ci95)} · ${B.overall.n_overlap_answers.toLocaleString("en")} overlap answers</div><div class="ln">top impact <b>${esc(B.leaderboard[0].competitor)}</b> ${pct(B.leaderboard[0].impact)}<br>duel win rate <b>${pct(B.duel_verdict.duel_win_rate)}</b> (R2 verdicts)</div>`, "#/competitors")}
    ${tile("Sentiment", `<div class="big">${f1(S.headline.score)}</div><div class="ci">R3 · negative ${pct(S.headline.shares.negative_pct)} · positive ${pct(S.headline.shares.positive_pct)}</div><div class="ln">under myth probes (R9): <b>${f1(S.narrative_resistance.score)}</b>, negative <b>${pct(S.narrative_resistance.shares.negative_pct)}</b><br>C1/C3/C4 brand-level: deferred to v2</div>`, "#/sentiment")}
    ${tile("Citation Tracking", `<div class="big">${pct(C.owner_shares.owned)} <span style="font-size:13px;font-weight:500;color:var(--muted)">owned</span></div><div class="ci">earned ${pct(C.owner_shares.earned)} · institutional ${pct(C.owner_shares.institutional)} · competitor ${pct(C.owner_shares.competitor)}</div><div class="ln">top domain <b>${esc(C.top_domains[0].domain)}</b> ${pct(C.top_domains[0].share)} of citations<br>owned share where we are named <b>${pct(C.owned_share_in_answers_with_us)}</b></div>`, "#/sources")}
    ${tile("Diagnosis & Prioritization", `<div class="ln">${P.recommendations.slice(0,3).map((r,i)=>`<b>${i+1}.</b> ${esc(r.group_id)} <span class="mono" style="color:var(--muted)">P${r.priority}</span>`).join("<br>")}</div><div class="ci" style="margin-top:6px">${P.rows_total} client rows · ${P.healthy_groups_count} healthy groups · ${P.label_recommendations.length} label rows</div>`, "#/priorities")}
    ${tile("Action Center", `<div class="big">${A.counters.open_total}</div><div class="ci">open · auto ${A.counters.open_auto} · manual ${A.counters.open_manual} · in progress ${A.counters.in_progress} · done ${A.counters.done_this_cycle}</div><div class="ln">${A.top3_open.map((t,i)=>`<b>${i+1}.</b> ${esc(t.group_id)} → ${esc(t.owner)} · P${t.priority}`).join("<br>")}</div>`, "#/actions")}
    ${tile("Safety / Label", `<div class="big"><span class="light ${L.traffic_light}"></span>${L.traffic_light.toUpperCase()}</div><div class="ci">critical answers ${pct(L.critical_answer_share)} ${ci(L.critical_ci95)}</div><div class="ln">findings <b>${L.findings.total}</b> · dangerous <b>${L.findings.dangerous}</b> · incomplete <b>${L.findings.incomplete}</b><br>awaiting sign-off: <b>${L.findings.pending_signoff}</b> · confirmed <b>${L.findings.confirmed}</b></div>`, "#/safety")}
    ${tile("Before / After", `<div class="big" style="font-size:18px">${BA.available?"available":"first cycle"}</div><div class="ln">${BA.available?"":`reason: ${esc(BA.reason)} · next cycle expected <b>${esc(BA.next_cycle_expected)}</b>`}</div>`, "", !BA.available)}
  </div>`;
}

// ---------------- shared: tables ----------------
function tbl(cols, rows, opts={}){
  // cols: [{k, h, f(row) -> html, sort(row) -> value}], rows: array; sortable by clicking headers
  const id = "t"+Math.random().toString(36).slice(2,8);
  const state = {k:opts.sortKey||null, dir:opts.sortDir||-1};
  const draw = () => {
    let r = rows.slice();
    if(state.k){ const c=cols.find(x=>x.k===state.k); const sv=c.sort||c.f; r.sort((a,b)=>{const x=sv(a),y=sv(b); return (x>y?1:x<y?-1:0)*state.dir;}); }
    return `<div class="tblwrap"><table class="t2"><thead><tr>${cols.map(c=>`<th data-k="${c.k}" class="${state.k===c.k?"sorted":""}">${c.h}${state.k===c.k?(state.dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>${r.map(row=>`<tr${opts.rowAttr?opts.rowAttr(row):""}>${cols.map(c=>`<td>${c.f(row)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  };
  setTimeout(()=>{ const host=document.getElementById(id); if(!host) return; host.querySelectorAll("th").forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(state.k===k) state.dir*=-1; else {state.k=k; state.dir=-1;} host.innerHTML=draw(); bind(); }); const bind=()=>host.querySelectorAll("tr[data-href]").forEach(tr=>tr.onclick=()=>location.hash=tr.dataset.href); bind(); },0);
  return `<div id="${id}">${draw()}</div>`;
}

// ---------------- shared: point table with filters ----------------
function famChips(p){ return (p.metrics.by_model||[]).map(m=>`<span class="mc"><b>${esc(m.model_family)}</b> ${m.we_present}/${m.answers}</span>`).join(""); }
function pointTable(el, keys, opts={}){
  const st = {run:"",zone:"",topic:"",sub:"",fam:"",qt:"",stage:"",code:"",cause:"",sev:"",text:""};
  const all = keys.map(k=>PTS[k]);
  const uniq = (f) => [...new Set(all.map(f).filter(Boolean))].sort();
  const sel = (id,label,vals) => `<select id="${id}"><option value="">${label}</option>${vals.map(v=>`<option>${esc(v)}</option>`).join("")}</select>`;
  el.innerHTML = `<div class="filters">${sel("pf_run","Run: all",uniq(p=>p.run))}${sel("pf_zone","Zone: all",uniq(p=>p.zone))}${sel("pf_topic","Topic: all",uniq(p=>p.topic))}${sel("pf_sub","Subtopic: all",uniq(p=>p.subtopic))}${sel("pf_fam","Family: all",uniq(p=>(p.metrics.by_model||[]).map(m=>m.model_family)).flat())}${sel("pf_qt","Query type: all",uniq(p=>p.query_type))}${sel("pf_stage","Stage: all",uniq(p=>p.patient_stage))}${sel("pf_code","Code: all",uniq(p=>p.code))}${sel("pf_cause","Cause: all",uniq(p=>p.cause&&p.cause.code))}${sel("pf_sev","Sev: all",["good","warn","bad"])}<input type="search" id="pf_text" placeholder="Search questions / pid…"><button class="reset" id="pf_reset">Reset</button></div><p class="count" id="pf_cnt"></p><div id="pf_tbl"></div>`;
  const cols = [
    {k:"pid",h:"Point",f:p=>`<span class="corner">${p.pid}</span><div class="z" style="font:500 10.5px 'IBM Plex Mono';color:var(--muted)">${p.run} · ${p.class}</div>`,sort:p=>p.pid+p.run},
    {k:"q",h:"Question",f:p=>`<div class="qtext"><div class="t">${esc(p.question)}</div><div class="z">${esc(p.zone)} · ${esc(p.query_type)} · ${esc(p.patient_stage)}</div></div>`,sort:p=>p.question},
    {k:"topic",h:"Topic / subtopic",f:p=>`${esc(p.topic)}${p.subtopic?` / ${esc(p.subtopic)}`:""}`,sort:p=>p.topic+(p.subtopic||"")},
    {k:"sev",h:"Sev",f:p=>`<span class="pill ${(SEV[p.sev]||[])[1]||"s-na"}">${esc(p.sev)}</span>`,sort:p=>({bad:0,warn:1,good:2})[p.sev]},
    {k:"code",h:"Code (what) · cause (why)",f:p=>titleCause(p.code,p.code_label,p.cause),sort:p=>p.code},
    {k:"pres",h:"Presence",f:p=>p.metrics.we_present_share==null?"—":`<span class="num">${shr(p.metrics.we_present_share)}</span><div class="bar2"><i style="width:${Math.round(p.metrics.we_present_share*100)}%"></i></div>`,sort:p=>p.metrics.we_present_share??-1},
    {k:"pos",h:"Position",f:p=>f1(p.metrics.avg_position),sort:p=>p.metrics.avg_position??99},
    {k:"models",h:"Models (present / answers)",f:p=>`<div class="mchips">${famChips(p)}</div>`,sort:p=>p.metrics.answers},
    {k:"dem",h:"Topic demand",f:p=>`<span class="vol">${f1(p.demand.topic_demand)}</span>`,sort:p=>p.demand.topic_demand},
    {k:"rank",h:"Rank score",f:p=>`<span class="num">${f1(p.point_rank_score)}</span>`,sort:p=>p.point_rank_score},
  ];
  const draw = () => {
    const q = st.text.toLowerCase();
    const list = all.filter(p => (!st.run||p.run===st.run)&&(!st.zone||p.zone===st.zone)&&(!st.topic||p.topic===st.topic)&&(!st.sub||p.subtopic===st.sub)&&(!st.fam||(p.metrics.by_model||[]).some(m=>m.model_family===st.fam))&&(!st.qt||p.query_type===st.qt)&&(!st.stage||p.patient_stage===st.stage)&&(!st.code||p.code===st.code)&&(!st.cause||(p.cause&&p.cause.code===st.cause))&&(!st.sev||p.sev===st.sev)&&(!q||p.question.toLowerCase().includes(q)||p.pid.toLowerCase().includes(q)));
    document.getElementById("pf_cnt").textContent = `${list.length.toLocaleString("en")} of ${all.length.toLocaleString("en")} points${opts.caption?" · "+opts.caption:""}`;
    window.__lastList = list.map(p=>p.pid+"|"+p.run);
    document.getElementById("pf_tbl").innerHTML = tbl(cols, list, {sortKey:opts.sortKey||null, sortDir:opts.sortDir||-1, rowAttr:p=>` class="pt" data-href="#/point/${encodeURIComponent(p.pid+"|"+p.run)}"`});
  };
  Object.keys(st).forEach(k=>{ const e=document.getElementById("pf_"+k); if(e) e[k==="text"?"oninput":"onchange"]=ev=>{st[k]=ev.target.value;draw();}; });
  document.getElementById("pf_reset").onclick=()=>{Object.keys(st).forEach(k=>{st[k]="";const e=document.getElementById("pf_"+k);if(e)e.value="";});draw();};
  (opts.preset||[]).forEach(([k,v])=>{ st[k]=v; const e=document.getElementById("pf_"+k); if(e) e.value=v; });
  draw();
}
function sliceTable(rows, key, label){ return tbl([{k:"k",h:label,f:d=>`<b>${esc(d[key])}</b>${d.low_n?' <span class="tag ci">low_n</span>':""}`},{k:"p",h:"Prompts",f:d=>d.n_prompts,sort:d=>d.n_prompts},{k:"n",h:"Answers",f:d=>d.n_answers,sort:d=>d.n_answers},{k:"v",h:"Visibility",f:d=>`<span class="num">${pct(d.visibility_pct)}</span> <span class="ci">${ci(d.visibility_ci95)}</span><div class="bar2"><i style="width:${Math.round(d.visibility_pct)}%"></i></div>`,sort:d=>d.visibility_pct},{k:"pos",h:"Avg position",f:d=>f1(d.average_position),sort:d=>d.average_position??99},{k:"s",h:"Brand score",f:d=>f1(d.ai_brand_score),sort:d=>d.ai_brand_score},{k:"inn",h:"INN-only",f:d=>pct(d.inn_only_mention_pct),sort:d=>d.inn_only_mention_pct}], rows, {sortKey:"v"}); }
function sec(h, inner, note){ return `<div class="sec"><h3>${h}</h3>${inner}${note?`<p class="note">${note}</p>`:""}</div>`; }
function kv(pairs){ return `<div class="kv">${pairs.map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("")}</div>`; }

// ---------------- Level 2 screens ----------------
function vVisibility(el){
  const V=DASH.visibility;
  el.innerHTML = sec("Visibility — headline (R1 C1)", kv([["Visibility",pct(V.headline.visibility_pct)+" "+ci(V.headline.visibility_ci95)],["Average position",f1(V.headline.average_position)],["AI Brand Score",f1(V.headline.ai_brand_score)],["Brand-bearing only",pct(V.headline.visibility_pct_brand_bearing_only)],["INN-only mention",pct(V.headline.inn_only_mention_pct)],["Cross-check vs scorer",`${pct(V.cross_check.r1_visibility_pct_from_we_present)} vs ${pct(V.cross_check.r1_visibility_pct_from_our_status_scored)} (${V.cross_check.within_0_5?"within 0.5":"outside 0.5"})`]]), esc(V.scope_note)+" · surfaces not covered: "+esc((V.scope.surfaces_not_covered||[]).join(", ")))
   + sec("By model family", tbl([
      {k:"m",h:"Family",f:d=>`<b>${esc(d.model)}</b> <span class="mono" style="color:var(--muted)">${esc((d.versions||[]).join(", "))}</span>`},

      {k:"s",h:"Critical share",f:f=>shr(f.critical_share),sort:f=>f.critical_share},{k:"n",h:"n",f:f=>f.n},{k:"st",h:"Stability",f:f=>f1(f.stability)},{k:"ls",h:"Label sections",f:f=>esc((f.label_sections||[]).join(", "))},
      {k:"so",h:"Sign-off",f:f=>`<span class="tag ${f.signoff_status==="confirmed"?"conf":"pend"}">${f.signoff_status==="pending"?"awaiting sign-off":esc(f.signoff_status)}</span>${f.single_run?' <span class="tag ci">single_run</span>':""}`},
      {k:"cv",h:"Caveat",f:f=>`<span title="${esc(f.scoring_caveat)}" style="color:var(--muted);font-size:11px">${esc((f.scoring_caveat||"").slice(0,90))}…${(f.flagged_for_review||[]).length?` <span class="tag ci">${f.flagged_for_review.length} flagged</span>`:""}</span>`}], findings, {sortKey:"s"}), esc(L.scoring_caveat))
   + sec("By surface", tbl([{k:"s",h:"Surface",f:d=>`<b>${esc(d.surface)}</b>${d.single_run?' <span class="tag ci">single_run</span>':""}`},{k:"n",h:"Answers",f:d=>d.n},{k:"c",h:"Critical share",f:d=>pct(d.critical_share),sort:d=>d.critical_share},{k:"f",h:"Findings",f:d=>d.findings},{k:"w",h:"Worst class",f:d=>esc(d.worst_class||"—")},{k:"x",h:"Excluded",f:d=>pct(d.excluded_pct)}], L.by_surface, {sortKey:"c"}))
   + sec("Top label sections by CRITICAL answers", tbl([{k:"s",h:"Section",f:d=>`<b>${esc(d.section)}</b>`},{k:"t",h:"Targets",f:d=>esc((d.targets||[d.target]).join(", "))},{k:"n",h:"Critical answers",f:d=>d.critical_answers}], L.top_label_sections), "Error types among CRITICAL: "+Object.entries(L.error_types).map(([k,v])=>`${k} ${pct(v)}`).join(" · ")+".")
   + sec("By target (R4)", tbl([{k:"t",h:"Target",f:d=>`<b>${esc(d.target)}</b>`},{k:"tier",h:"Tier",f:d=>esc(d.tier),sort:d=>d.tier},{k:"ls",h:"Label section",f:d=>esc(d.label_section)},{k:"n",h:"Answers",f:d=>d.n,sort:d=>d.n},{k:"c",h:"Critical share",f:d=>`<span class="num">${pct(d.critical_share)}</span><div class="bar2"><i style="width:${Math.round(d.critical_share)}%;background:var(--crit)"></i></div>`,sort:d=>d.critical_share},{k:"d",h:"Dangerous share",f:d=>pct(d.dangerous_share),sort:d=>d.dangerous_share},{k:"fs",h:"Findings on surfaces",f:d=>esc((d.findings_surfaces||[]).join(", "))}], D.breakdowns.safety_by_target, {sortKey:"c"}))
   + sec("Unstable cells (critical share between 0 and the finding threshold)", tbl([{k:"t",h:"Target",f:d=>`<b>${esc(d.target)}</b>`},{k:"s",h:"Surface",f:d=>esc(d.surface)},{k:"n",h:"n",f:d=>d.n},{k:"c",h:"Critical share",f:d=>shr(d.critical_share),sort:d=>d.critical_share}], D.breakdowns.safety_unstable_cells, {sortKey:"c"}))
   + `<div class="sec"><h3>Points${t?` — R4 answers in cell ${esc(t)} × ${esc(s||"")}`:" — R4"}</h3><div id="pt"></div></div>`;
  let keys = KEYS.filter(k=>PTS[k].run==="R4");
  if(t){ const f=findings.find(x=>x.target===t&&x.surface===s); if(f) keys = f.pids; }
  pointTable(document.getElementById("pt"), keys, {sortKey:"dem", caption: t?`cell ${t} × ${s}`:"R4"});
}

// ---------------- map data on demand ----------------
let mapPromise=null;
function openMapRoute(){
  if(window.__openMap){ window.__openMap(); return; }
  if(!mapPromise) mapPromise = loadScript("map_data.js").then(()=>{ window.__mapBoot(); });
  mapPromise.then(()=>{ if(location.hash.startsWith("#/map")) window.__openMap(); }).catch(e=>{ document.getElementById("view2").innerHTML=`<div class="sec">Neural map data (map_data.js) could not be loaded: ${esc(e.message)}</div>`; });
}
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error(src+" not found")); document.head.appendChild(sc); }); }

// ---------------- Level 3: point ----------------
const ANSWERS={}, ansPromise={};   // one gzip+base64 store per run: answers_R1.js … loaded only for the point's run
function loadAnswers(run){
  if(ansPromise[run]) return ansPromise[run];
  ansPromise[run] = loadScript("answers_"+run+".js").then(async()=>{ const b64=window["ANSWERS_B64_"+run]; const bin=Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); const ds=new DecompressionStream("gzip"); const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text(); Object.assign(ANSWERS, JSON.parse(text)); });
  return ansPromise[run];
}
function level3(el, key){
  const p = PTS[key]; if(!p){ el.innerHTML=`<div class="sec">Point ${esc(key)} not found.</div>`; return; }
  const list = window.__lastList || KEYS; const i = list.indexOf(key);
  const nav = `<div class="prevnext">${i>0?`<a href="#/point/${encodeURIComponent(list[i-1])}">← prev</a>`:""}<a href="javascript:history.back()">↑ back</a>${i>=0&&i<list.length-1?`<a href="#/point/${encodeURIComponent(list[i+1])}">next →</a>`:""}<span class="mono" style="color:var(--muted)">${i>=0?`${i+1} of ${list.length} in current list`:""}</span></div>`;
  const m = p.metrics; const g = groupById[p.group_id];
  const runspec = Object.entries(m.run_specific||{}).map(([k,v])=>`<span>${esc(k)}: <b>${esc(Object.entries(v).map(([a,b])=>`${a}×${b}`).join(", "))}</b></span>`).join("");
  el.innerHTML = nav + `<div class="sec"><div class="kicker">${esc(p.pid)} · ${esc(p.run)} · ${esc(p.class)} · <a href="#/priorities?group=${encodeURIComponent(p.group_id)}" style="color:var(--accent)">${esc(p.group_id)}</a></div><h1 style="font-size:19px">${esc(p.question)}</h1><div class="kv"><span>${esc(p.zone)}</span><span>${esc(p.topic)}${p.subtopic?` / ${esc(p.subtopic)}`:""}</span><span>${esc(p.patient_stage)}</span><span>${esc(p.query_type)}</span><span class="pill ${(SEV[p.sev]||[])[1]||"s-na"}">${esc(p.sev)}</span></div><div style="margin-top:10px">${titleCause(p.code,p.code_label,p.cause)}</div>${p.cause&&p.cause.evidence?`<ul class="note" style="margin:6px 0 0 16px">${p.cause.evidence.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:""}</div>
  <div class="pt-detail"><div>
    ${sec("Metrics (from the pipeline)", kv([["Answers",m.answers],["Excluded",m.answers_excluded],["Presence share",shr(m.we_present_share)],["Avg position",f1(m.avg_position)],["INN-only",shr(m.inn_only_share)],["Rank score",f1(p.point_rank_score)]]) + `<div style="margin-top:8px">${tbl([{k:"f",h:"Family",f:r=>`<b>${esc(r.model_family)}</b>`},{k:"a",h:"Answers",f:r=>r.answers},{k:"w",h:"We present",f:r=>r.we_present},{k:"p",h:"Position",f:r=>f1(r.position)},{k:"bs",h:"Brand sentiment",f:r=>f1(r.brand_sentiment)},{k:"as",h:"Answer sentiment",f:r=>f1(r.answer_sentiment)}], m.by_model)}</div><div class="note">Competitors present: ${Object.entries(m.competitors_present||{}).map(([k,v])=>`${esc(k)} ${v}`).join(" · ")||"none"}</div><div class="note">Citations: total ${m.citations.total} · owned ${m.citations.owned} · earned ${m.citations.earned} · institutional ${m.citations.institutional} · competitor ${m.citations.competitor} · adversarial ${m.citations.adversarial}</div><div class="kv" style="margin-top:6px">${runspec}</div>`)}
    ${sec("Diagnosis (platform export)", `<div class="whyblk">${(p.diagnosis_text||[]).map((s,i)=>`<div class="${i===0?"wl":"wp"}">${esc(s)}</div>`).join("")}</div>`)}
    ${sec("Evidence lines (platform export)", `<div class="whyblk" style="border-left-color:var(--good)"><ul>${(p.evidence_lines||[]).map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`)}
    ${sec("Answers — full text, one per model × repeat", `<button class="showans" id="loadAns">load answers ▾</button><div id="ansBox"></div>`, "Loaded on demand from answers_<run>.js (full texts from the corpus, gzip). Excluded answers are flagged; their verdicts are not counted.")}
  </div><div>
    ${sec("Sources", `<div class="srcdoms">${(m.citations.top_domains||[]).map(d=>`<a class="sd-chip" href="#/sources?domain=${encodeURIComponent(d.domain)}" style="text-decoration:none">${esc(d.domain)} <b>×${d.n}</b> <span style="color:var(--muted)">${esc(d.owner)}${d.subtype?"/"+esc(d.subtype):""}</span></a>`).join("")||"<span class='note'>no citations</span>"}</div>` + (p.serp?`<h4 style="margin:12px 0 4px;font:600 10.5px 'IBM Plex Mono';color:var(--muted)">SERP SNAPSHOT</h4><div class="note">Google: ${p.serp.our?"#"+p.serp.our:"absent"} · competitor ${p.serp.comp?"#"+p.serp.comp:"absent"} · occupiers ${(p.serp.occ||[]).map(esc).join(", ")} · overlap ${p.serp.ov??"—"}%</div>`:"") + (p.inventory?`<h4 style="margin:12px 0 4px;font:600 10.5px 'IBM Plex Mono';color:var(--muted)">OUR-PAGE INVENTORY</h4><div class="note">${esc(p.inventory.v)} · ${p.inventory.url?`<a href="${esc(p.inventory.url)}" target="_blank" rel="noopener">${esc(p.inventory.url)}</a>`:""}<br>${esc(p.inventory.miss||"")}</div>`:""))}
    ${sec("Demand", kv([["Topic demand",f1(p.demand.topic_demand)],["lo–hi",`${f1(p.demand.lo)}–${f1(p.demand.hi)}`],["basis",esc(p.demand.basis)]]) + `<div class="note">prompt_share ${f1(p.demand_extra.prompt_share)} · AI-native ${p.demand_extra.ai_native?"yes":"no"} (source: platform export)</div>`)}
    ${sec("Fix cards — client", p.fixes.filter(c=>c.audience==="client").map(fixCard).join("")||"<span class='note'>none</span>")}
    <div class="sec"><button class="collapse" onclick="document.getElementById('cit2').classList.toggle('hide')">Citere monitoring ▾ (${p.fixes.filter(c=>c.audience==="citere").length} TRACK cards)</button><div id="cit2" class="hide">${p.fixes.filter(c=>c.audience==="citere").map(fixCard).join("")}</div></div>
  </div></div>`;
  document.getElementById("loadAns").onclick = async (ev) => {
    ev.target.textContent = "loading…";
    let err=null; try{ await loadAnswers(p.run); }catch(e){ err=e; }
    const arr = ANSWERS[key] || [];
    document.getElementById("ansBox").innerHTML = arr.length ? arr.map((a,i)=>`<div class="ans"><div class="ah" onclick="this.nextElementSibling.classList.toggle('hide')"><b>${esc(a.model)}</b><span class="mono">repeat ${a.repeat_idx}</span>${a.excluded?`<span class="excl">excluded · ${esc(a.exclude_reason)}</span>`:""}<span class="mono">${a.citations.length} citations</span></div><div class="hide"><div class="ab">${esc(a.answer_clean)}</div><div class="cits">${a.citations.map(c=>`<a href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(c.owner)}">${esc(c.domain)}</a>`).join("")}</div></div></div>`).join("") : `<div class="note">No answer texts available (${err?esc(err.message):"key absent in answers_"+esc(p.run)+".js"}).</div>`;
    ev.target.textContent = `${arr.length} answers loaded`;
  };
}
function fixCard(c){ return `<div class="fx"><div class="fxh"><span class="exb ${c.platform_execution==="AGENT"?"exa":c.platform_execution==="AGENT+APPROVE"?"exp":"exh"}">${esc(c.platform_execution)}</span><span class="atype ${c.type==="LABEL-MEDICAL"?"label":c.type.toLowerCase()}">${esc(c.type)}</span><span class="mlrb ${c.mlr==="medical-review"?"mr":"ok"}">${c.mlr==="medical-review"?"MEDICAL REVIEW":"MLR-COMPATIBLE"}</span><span class="ow">${esc(c.owner)}</span><span class="sp">· ${esc(c.speed)}</span></div><div class="fxa">${esc(c.action)}</div><div class="fxl"><b>Why:</b> ${esc(c.why)}</div>${c.effect?`<div class="fxl"><b>Expected effect:</b> ${esc(c.effect)}</div>`:""}${c.verify?`<div class="fxl"><b>Verify on re-run:</b> ${esc(c.verify)}</div>`:""}<div class="fxl"><b>Execution:</b> ${esc(c.agent)}</div></div>`; }

const PID2KEY = {}; KEYS.forEach(k=>{ const pid=k.split("|")[0]; if(!PID2KEY[pid]) PID2KEY[pid]=k; });
window.__nmGoPoint = pid => { location.hash = "#/point/"+encodeURIComponent(PID2KEY[pid]||pid); };
window.__nmGoFix = pid => { location.hash = "#/actions"; };
document.getElementById("nmClose").addEventListener("click", () => { if(location.hash.startsWith("#/map")) location.hash = "#/"; });
</script>
