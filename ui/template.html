<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ozempic in AI answers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- IBM Plex is referenced only by the untouched Neural map block -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!--MOCKUP_STYLE-->
<style>
/* ---- platform additions: every value derives from the mockup tokens above ---- */
.nav{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 22px}
.nav a{padding:9px 12px;margin-bottom:-1px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;border-bottom:2px solid transparent}
.nav a.on{color:var(--ink);border-bottom-color:var(--us)}
.nav a:hover{color:var(--ink)}
h2.page{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:24px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.kicker{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.stack{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.tile h2 a{color:var(--us);text-decoration:none;font-weight:500;font-size:13px}
.tile.quiet{border-style:dashed}
.subline{color:var(--muted);font-size:13px}
.tblwrap{overflow-x:auto;min-width:0}
/* grid tracks must be allowed to shrink below content width, or one long string widens the page */
.grid,.stack{grid-template-columns:repeat(12,minmax(0,1fr))}
/* one rhythm for every table: mockup row padding (7px 0), plus a fixed gutter between columns */
th,td{padding-right:12px}
th:last-child,td:last-child{padding-right:0}
th{white-space:normal;vertical-align:bottom} th.n{white-space:nowrap}
th.c,td.c{text-align:center}
.tag{white-space:nowrap}
td.cw,th.cw{min-width:150px}
td.cq,th.cq{min-width:260px;max-width:460px}
td.cc,th.cc{min-width:180px;max-width:300px}
td.cx,th.cx{min-width:220px;max-width:360px}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.tblwrap.scroll{max-height:520px;overflow:auto}
.tblwrap.tall{max-height:820px;overflow:auto}
.tblwrap.scroll thead th,.tblwrap.tall thead th{position:sticky;top:0;background:var(--panel);z-index:1}
.pt-table{min-width:1080px}
.row.top{align-items:flex-start}
.tile > .note:last-child{margin-top:auto}
th.sort{cursor:pointer;user-select:none}
th.sort.on{color:var(--ink)}
tr.pt{cursor:pointer}
tr.pt:hover td{background:var(--soft)}
td .z{color:var(--muted);font-size:12px;margin-top:2px}
.pid{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.title{font-weight:600}
.causeln{color:var(--muted);font-size:12px;margin-top:2px}
.tag.mute{background:var(--soft);color:var(--muted)}
.tag.ink{background:var(--soft);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;max-width:220px}
.filters input{border-radius:var(--radius);min-width:220px}
.filters .btn{padding:5px 12px;font-size:13px}
.count{color:var(--muted);font-size:13px}
.bars{display:flex;gap:6px;align-items:center;min-width:120px}
.bars .bar{flex:1;height:6px}
.bars span{font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.mchips{display:flex;flex-wrap:wrap;gap:4px}
.mc{border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:12px;color:var(--muted);white-space:nowrap}
.mc b{color:var(--ink);font-weight:500}
.light.yellow::before{background:var(--warn);box-shadow:0 0 0 4px var(--comp-soft)}
.light.green::before{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.safety.yellow{border-left-color:var(--warn)} .safety.yellow .big{color:var(--warn)}
.safety.green{border-left-color:var(--ok)} .safety.green .big{color:var(--ok)}
.lead{color:var(--muted);font-size:13px;margin:-2px 0 10px;max-width:78ch}
.rec{display:grid;gap:3px;padding:14px 12px;margin:0 -12px;border-top:1px solid var(--line);cursor:pointer}
.rec:first-of-type{border-top:0}
.rec:hover{background:var(--soft)}
.rec-t{font-size:15px;font-weight:600;line-height:1.3;text-wrap:balance}
.rec-n{font-size:13px}
.rec-w{font-size:13px;color:var(--muted)}
.rec-f{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);margin-top:3px}
.rec-f b{color:var(--ink);font-weight:500}
.chip-s{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink);text-decoration:none;background:var(--panel);white-space:nowrap}
.chip-s:hover{border-color:var(--us);color:var(--us)}
.chip-s .st{color:var(--muted)}
.hz{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:9px 12px;margin:0 -12px;border-top:1px solid var(--line);cursor:pointer;align-items:baseline}
.hz:first-of-type{border-top:0}
.hz:hover{background:var(--soft)}
.hz .s{font-weight:500}
.hz .d{color:var(--muted);font-size:13px}
.hz .n{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.dist{display:grid;grid-template-columns:minmax(0,1fr) 46px 90px;gap:4px 10px;align-items:center;font-size:13px}
.dist .n{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.camp.hit{background:var(--us-soft);margin:0 -12px;padding:10px 12px;border-radius:var(--radius)}
.backlink{color:var(--us);text-decoration:none;font-size:13px;font-weight:500}
.prevnext{display:flex;gap:14px;align-items:center;font-size:13px;margin-bottom:14px}
.prevnext a{color:var(--us);text-decoration:none;font-weight:500}
.prevnext .count{margin-left:auto}
.para{max-width:68ch;line-height:1.55}
.para p{margin:0 0 8px}
.evid{margin:0;padding-left:18px;max-width:68ch;line-height:1.5}
.evid li{margin:2px 0}
.ans{border:1px solid var(--line);border-radius:var(--radius);margin:8px 0;background:var(--panel)}
.ans .ah{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;cursor:pointer;font-size:13px}
.ans .ah .who{font-weight:600}
.ans .ah .m{color:var(--muted)}
.ans .ab{padding:6px 14px 12px;white-space:pre-wrap;line-height:1.55;max-width:80ch;border-top:1px solid var(--line)}
.ans .cits{padding:0 14px 12px;display:flex;flex-wrap:wrap;gap:4px}
.ans .cits a{border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-size:12px;color:var(--muted);text-decoration:none;background:var(--soft)}
.fx{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:5px}
.fx:first-child{border-top:0}
.fx .fxh{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.fx .fxa{font-weight:500}
.fx .fxl{font-size:13px;color:var(--muted)}
.fx .fxl b{color:var(--ink);font-weight:500}
.camp{border-top:1px solid var(--line);padding:10px 0}
.camp:first-of-type{border-top:0}
.camp .ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;cursor:pointer}
.camp .ch .t{font-weight:600;min-width:0}
.camp .ch .meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--muted);font-size:13px}
.camp .ch select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);padding:2px 6px;max-width:100%}
@media (max-width:640px){.camp .ch{grid-template-columns:auto minmax(0,1fr)} .camp .ch select{grid-column:2;justify-self:start} .camp .ch .meta{grid-column:2}}
.camp .body{padding:8px 0 0}
.collapse{background:none;border:0;padding:0;color:var(--us);font:inherit;font-weight:500;cursor:pointer}
.srclist{display:flex;flex-wrap:wrap;gap:4px}
.srclist a{border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-size:12px;color:var(--ink);text-decoration:none}
.srclist a span{color:var(--muted)}
.hide{display:none}
.big.pct small,.mid.pct small{margin-left:2px}
@media (max-width:980px){.stack>.c7,.stack>.c5{grid-column:span 12}}
@media print{.nav,.btn,#view2,#view3,#mapView{display:none!important}.wrap{padding:0}.tile{break-inside:avoid}}
</style>
<!--LEGACY_MAP_CSS-->
</head><body>
<div class="wrap" id="app">
  <header>
    <div><h1 id="hTitle"></h1><div class="sub" id="hSub"></div></div>
    <div class="chips" id="hChips"></div>
  </header>
  <nav class="nav" id="nav"></nav>
  <div id="view1"></div>
  <div id="view2"></div>
  <div id="view3"></div>
</div>
<!--LEGACY_MAP_HTML-->
<script>/*PLATFORM_DATA*/</script>
<script>
"use strict";
const D = window.PLATFORM_DATA;
const DASH = D.dashboard, PTS = D.points, GROUPS = D.groups;
const KEYS = Object.keys(PTS);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const f1 = v => (v==null||v==="") ? "—" : (typeof v==="number" ? (Number.isInteger(v)?v.toLocaleString("en"):v.toFixed(1)) : esc(v));
const pct = v => v==null ? "—" : (v*1).toFixed(1)+"%";
const pct0 = v => v==null ? "—" : Math.round(v*1)+"%";
const shr = v => v==null ? "—" : (v*100).toFixed(1)+"%";        // pipeline shares stored 0–1
const shr0 = v => v==null ? "—" : Math.round(v*100)+"%";
const fmtK = v => v==null ? "—" : (v>=1000 ? Math.round(v/1000).toLocaleString("en")+"K" : Math.round(v).toString());
const ci = a => (a&&a.length===2) ? `${(+a[0]).toFixed(1)}–${(+a[1]).toFixed(1)}%` : "";
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const period = p => { const [y,m]=p.split("-"); return `${MONTHS[+m-1]} ${y}`; };
const SEVTAG = {good:"ok",warn:"warn",bad:"bad"};
const CONF = {high:"high",med:"medium",medium:"medium",low:"low"};
const themeName = t => t.includes(" · ") ? t.split(" · ").slice(1).join(" · ") : t;
const titleCause = (code, label, cause) => `<div class="title">${esc(label||code)}</div>${cause?`<div class="causeln">${esc(cause.label||cause.code)} · confidence ${esc(CONF[(cause.confidence||"").toLowerCase()]||cause.confidence||"—")}</div>`:""}`;
const groupById = Object.fromEntries(GROUPS.map(g=>[g.group_id,g]));
const campById = Object.fromEntries(D.campaigns.map(t=>[t.task_id,t]));
const heldById = Object.fromEntries((D.label_tasks_awaiting_signoff||[]).map(t=>[t.task_id,t]));
const ROUTES = ["visibility","competitors","sentiment","sources","priorities","actions","safety","map"];
const NAVL = {"":"Dashboard",visibility:"Visibility",competitors:"Competitors",sentiment:"Sentiment",sources:"Sources",priorities:"Priorities",actions:"Actions",safety:"Safety / Label",map:"Neural map"};
const M = DASH.meta;

// ---------------- header ----------------
document.getElementById("hTitle").textContent = `${M.brand} in AI answers`;
document.getElementById("hSub").textContent = `Cycle ${M.cycle}, ${period(M.period)}. ${M.market==="US/en"?"United States, English":M.market}. Against ${M.competitors.join(", ")}.`;
document.getElementById("hChips").innerHTML = `<span class="chip"><strong>${M.prompts.toLocaleString("en")}</strong> questions</span><span class="chip"><strong>${M.answers.toLocaleString("en")}</strong> answers</span><span class="chip"><strong>${M.surfaces}</strong> AI surfaces</span><button class="btn" type="button" onclick="window.print()">Export one-page PDF</button>`;
document.getElementById("nav").innerHTML = ["",...ROUTES].map(r=>`<a href="#/${r}" data-r="${r}">${NAVL[r]}</a>`).join("");

// ---------------- router ----------------
function parseHash(){
  const h = location.hash.replace(/^#\/?/,""); const [path,qs] = h.split("?"); const q = new URLSearchParams(qs||"");
  if(path.startsWith("point/")) return {route:"point", key:decodeURIComponent(path.slice(6)), q};
  return {route:path||"", q};
}
window.addEventListener("hashchange", render); render();
function render(){
  const {route,key,q} = parseHash();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.r===route));
  const v1=document.getElementById("view1"), v2=document.getElementById("view2"), v3=document.getElementById("view3");
  v1.innerHTML=v2.innerHTML=v3.innerHTML="";
  if(route==="map"){ openMapRoute(); return; } else { window.__closeMap && window.__closeMap(); }
  if(route==="") return level1(v1);
  if(route==="point") return level3(v3, key, q);
  const fn = {visibility:vVisibility, competitors:vCompetitors, sentiment:vSentiment, sources:vSources, priorities:vPriorities, actions:vActions, safety:vSafety}[route];
  if(fn) fn(v2, q); else v2.innerHTML = `<section class="tile">Unknown route.</section>`;
  window.scrollTo(0,0);
}

// ---------------- Level 1: the approved master screen with real data ----------------
function level1(el){
  const V=DASH.visibility, H=V.headline, B=DASH.benchmarking, S=DASH.sentiment, C=DASH.citations, P=DASH.prioritization, A=DASH.action_center, L=DASH.safety_label, BA=DASH.before_after;
  const lo=H.visibility_ci95[0], hi=H.visibility_ci95[1];
  const fam = V.by_model.map(d=>`<div>${esc(cap(d.model))}</div><div class="bar"><i class="t-us" style="width:${Math.min(100,Math.max(0,d.ai_brand_score))}%"></i></div><div>${(+d.ai_brand_score).toFixed(1)}</div>`).join("");
  const lead = B.leaderboard.slice(0,4).map(d=>`<tr><td>${esc(d.competitor)}</td><td class="n">${pct(d.impact)}</td><td class="n">${pct(d.impact_by_absence)}</td></tr>`).join("");
  const worst = L.by_surface.slice().sort((a,b)=>b.critical_share-a.critical_share)[0];
  const lightText = {red:"Dangerous errors found", yellow:"Warnings found", green:"No critical findings"}[L.traffic_light]||L.traffic_light;
  const r3 = S.top_negative_themes.filter(t=>t.run==="R3").slice(0,5).map(t=>`<tr><td>${esc(themeName(t.theme))}</td><td class="n">${pct0(t.pct_of_negative)}</td></tr>`).join("");
  const gap = C.gap_list.slice(0,4).map(g=>`<tr><td><a href="#/sources?domain=${encodeURIComponent(g.domain)}">${esc(g.domain)}</a></td><td class="n">${esc(g.subtype||g.owner)}</td><td class="n">gap ${g.gap_score}</td></tr>`).join("");
  const recs = P.recommendations.slice(0,3).map(r=>{ const g=groupById[r.group_id]; const o=r.owners[0]; return `<tr><td><span class="tag p${r.priority}">${r.priority}</span> <a href="#/priorities?group=${encodeURIComponent(r.group_id)}">${esc(r.group_id)}</a> — ${esc(o.owner)}<br><span class="note">Cause: ${esc(g.dominant_cause.code.toLowerCase())} in ${shr0(g.dominant_cause.share)} of points</span></td><td class="n">${fmtK(g.demand)}</td><td class="n">${shr0(g.gap)}</td><td class="n">${shr0(o.lever)}</td><td class="n">up to ${(+o.ceiling_pp).toFixed(0)} pp</td></tr>`; }).join("");
  const who = Object.entries(A.counters.by_who).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`<div>${esc(k)}</div><div>${v}</div>`).join("");
  const next = A.top3_open.map(t=>{ const c=campById[t.task_id]||{}; const e=t.impact.expected_pp; return `<tr><td><a href="#/actions">${esc(c.what||t.group_id+" → "+t.owner)}</a></td><td>${esc(t.who)}</td><td class="n">${e?`+${(+e[0]).toFixed(0)} to +${(+e[1]).toFixed(0)} pp`:"not estimated"}</td><td class="n"><span class="tag p1">open</span></td></tr>`; }).join("");
  el.innerHTML = `<div class="grid">
  <section class="tile c5" aria-label="Visibility Score" onclick="location.hash='#/visibility'">
    <h2>Visibility Score <span>unbranded questions, API models</span></h2>
    <div class="row">
      <div><div class="big">${(+H.ai_brand_score).toFixed(1)}<small>of 100</small></div><div class="note">AI Brand Score: how often we are named, weighted by how early</div></div>
      <div style="flex:1;min-width:180px">
        <div class="kv"><div>Named in answers</div><div>${pct(H.visibility_pct)}</div><div>Average position when named</div><div>${f1(H.average_position)}</div><div>Active ingredient named, brand not</div><div>${pct0(H.inn_only_mention_pct)}</div></div>
        <div class="ci" title="Wilson 95% interval"><b style="left:${lo}%;width:${(hi-lo).toFixed(2)}%"></b><i style="left:${H.visibility_pct}%"></i></div>
        <div class="note" style="margin-top:4px">95% interval ${ci(H.visibility_ci95)}. Change vs last cycle appears from cycle 2.</div>
      </div>
    </div>
    <div class="models">${fam}</div>
    <div class="note">${esc((V.scope.surfaces_not_covered||[]).join(", "))} not measured on unbranded questions this cycle.</div>
  </section>
  <section class="tile c4" aria-label="Competitive Benchmarking" onclick="location.hash='#/competitors'">
    <h2>Competitive Benchmarking <span>who takes our answers</span></h2>
    <div class="row">
      <div><div class="mid">${Math.round(B.overall.win_rate)}<small>% win rate</small></div><div class="note">ahead when both named</div></div>
      <div><div class="mid">${Math.round(B.duel_verdict.duel_win_rate)}<small>% in duels</small></div><div class="note">"${esc(M.brand)} vs X" questions</div></div>
    </div>
    <div class="tblwrap"><table><tr><th>Competitor</th><th class="n">Answers taken</th><th class="n">By absence</th></tr>${lead}</table></div>
    <div class="note">Win rate ${ci(B.overall.win_rate_ci95)} over ${B.overall.n_overlap_answers.toLocaleString("en")} overlap answers.</div>
  </section>
  <section class="tile c3 safety ${L.traffic_light}" aria-label="Safety and label flag" onclick="location.hash='#/safety'">
    <h2>Safety / Label <span>web surfaces</span></h2>
    <div class="light ${L.traffic_light}">${lightText}</div>
    <div class="big">${L.findings.total}<small>findings</small></div>
    <div class="kv"><div>Said something dangerous</div><div>${L.findings.dangerous}</div><div>Omitted a required warning</div><div>${L.findings.incomplete}</div><div>Awaiting clinical sign-off</div><div>${L.findings.pending_signoff}</div><div>Answers with a critical error</div><div>${pct0(L.critical_answer_share)}</div></div>
    <dl class="dl"><dt>Worst surface</dt><dd>${esc(worst.surface)}, ${pct0(worst.critical_share)} critical</dd><dt>Top label section</dt><dd>${esc(L.top_label_sections[0].section)} (${esc(L.top_label_sections[0].target)})</dd><dt>Then</dt><dd>${L.top_label_sections.slice(1).map(s=>`${esc(s.section)} (${esc(s.target)})`).join(", ")}</dd></dl>
    <div class="note">Findings reach the client report only after clinician sign-off.</div>
  </section>
  <section class="tile c3" aria-label="Sentiment" onclick="location.hash='#/sentiment'">
    <h2>Sentiment <span>questions about us</span></h2>
    <div class="mid">${Math.round(S.headline.score)}<small>of 100</small></div>
    <div class="bar"><i class="t-ok" style="width:${S.headline.shares.positive_pct}%"></i><i class="t-mute" style="width:${S.headline.shares.neutral_pct}%"></i><i class="t-bad" style="width:${S.headline.shares.negative_pct}%"></i></div>
    <div class="kv"><div>Positive</div><div>${pct0(S.headline.shares.positive_pct)}</div><div>Neutral</div><div>${pct0(S.headline.shares.neutral_pct)}</div><div>Negative</div><div>${pct0(S.headline.shares.negative_pct)}</div></div>
    <div class="note" style="margin-top:2px">What negative answers say</div>
    <div class="tblwrap"><table>${r3}</table></div>
    <div class="note">Under myth probes: ${Math.round(S.narrative_resistance.score)} of 100, ${pct0(S.narrative_resistance.shares.negative_pct)} negative.</div>
  </section>
  <section class="tile c4" aria-label="Citation tracking" onclick="location.hash='#/sources'">
    <h2>Citation Tracking <span>all runs with citations</span></h2>
    <div class="bar"><i class="t-comp" style="width:${C.owner_shares.earned}%"></i><i class="t-mute" style="width:${C.owner_shares.institutional}%"></i><i class="t-us" style="width:${C.owner_shares.owned}%"></i><i style="width:${C.owner_shares.competitor}%;background:var(--ink)"></i></div>
    <div class="kv">
      <div><span class="tag warn">earned</span> media, directories, forums, hospitals</div><div>${pct0(C.owner_shares.earned)}</div>
      <div><span class="tag p1">institutional</span> FDA, NIH, journals, Wikipedia</div><div>${pct0(C.owner_shares.institutional)}</div>
      <div><span class="tag us">owned</span> our sites</div><div>${pct(C.owner_shares.owned)}</div>
      <div><span class="tag p1">competitor</span> their sites</div><div>${pct(C.owner_shares.competitor)}</div>
      <div><span class="tag bad">threat</span> litigation, adversarial</div><div>${C.adversarial_sources.length} domain${C.adversarial_sources.length===1?"":"s"}</div>
    </div>
    <div class="note" style="margin-top:2px">Feeding answers about competitors, not us</div>
    <div class="tblwrap"><table>${gap}</table></div>
  </section>
  <section class="tile c5" aria-label="Diagnosis and prioritization" onclick="location.hash='#/priorities'">
    <h2>Diagnosis &amp; Prioritization <span>demand × gap × lever</span></h2>

// ---------------- shared: sortable table ----------------
function tbl(cols, rows, opts={}){
  const id = "t"+Math.random().toString(36).slice(2,8);
  const state = {k:opts.sortKey||null, dir:opts.sortDir||-1};
  const draw = () => {
    let r = rows.slice();
    if(state.k){ const c=cols.find(x=>x.k===state.k); const sv=c.sort||c.f; r.sort((a,b)=>{const x=sv(a),y=sv(b); return (x>y?1:x<y?-1:0)*state.dir;}); }
    const scroll = opts.scroll===undefined ? rows.length>12 : opts.scroll;
    const cls = c => [c.n?"n":"", c.c||""].filter(Boolean).join(" ");
    return `${scroll===true?`<div class="count">${rows.length.toLocaleString("en")} rows, scroll inside the table</div>`:""}<div class="tblwrap${scroll===true?" scroll":scroll==="tall"?" tall":""}"><table${opts.tableClass?` class="${opts.tableClass}"`:""}><thead><tr>${cols.map(c=>`<th data-k="${c.k}" class="sort ${cls(c)}${state.k===c.k?" on":""}">${c.h}${state.k===c.k?(state.dir>0?" ↑":" ↓"):""}</th>`).join("")}</tr></thead><tbody>${r.map(row=>`<tr${opts.rowAttr?opts.rowAttr(row):""}>${cols.map(c=>`<td class="${cls(c)}">${c.f(row)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  };
  setTimeout(()=>{ const host=document.getElementById(id); if(!host) return; const bind=()=>{ host.querySelectorAll("th").forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(state.k===k) state.dir*=-1; else {state.k=k; state.dir=-1;} host.innerHTML=draw(); bind(); }); host.querySelectorAll("tr[data-href]").forEach(tr=>tr.onclick=()=>location.hash=tr.dataset.href); }; bind(); },0);
  return `<div id="${id}">${draw()}</div>`;
}
function sec(h, inner, note, sub, span){ return `<section class="tile ${span||"c12"}"><h2>${h}${sub?` <span>${sub}</span>`:""}</h2>${inner}${note?`<div class="note">${note}</div>`:""}</section>`; }
function kv(pairs){ return `<div class="kv">${pairs.map(([k,v])=>`<div>${k}</div><div>${v}</div>`).join("")}</div>`; }
function bar(v, cls){ return `<div class="bars"><div class="bar"><i class="${cls||"t-us"}" style="width:${Math.min(100,Math.max(0,v||0))}%"></i></div><span>${pct(v)}</span></div>`; }
function page(title, sub){ return `<div style="margin-bottom:16px"><h2 class="page">${title}</h2>${sub?`<div class="subline">${sub}</div>`:""}</div>`; }

   + sec("By target", tbl([{k:"t",h:"Target",f:d=>esc(d.target)},{k:"tier",h:"Tier",c:"c",f:d=>`<span class="tag ${d.tier==="CRITICAL"?"bad":d.tier==="MAJOR"?"warn":"mute"}">${esc(d.tier.toLowerCase())}</span>`,sort:d=>d.tier},{k:"ls",h:"Label section",f:d=>esc(d.label_section)},{k:"n",h:"Answers",n:true,f:d=>d.n,sort:d=>d.n},{k:"c",h:"Critical",f:d=>bar(d.critical_share,"t-bad"),sort:d=>d.critical_share},{k:"d",h:"Dangerous",n:true,f:d=>pct(d.dangerous_share),sort:d=>d.dangerous_share},{k:"fs",h:"Findings on",f:d=>esc((d.findings_surfaces||[]).join(", "))}], D.breakdowns.safety_by_target, {sortKey:"c"}), "", "R4", "c7")
   + sec("Unstable cells", tbl([{k:"t",h:"Target",f:d=>esc(d.target)},{k:"s",h:"Surface",f:d=>esc(d.surface)},{k:"n",h:"n",n:true,f:d=>d.n},{k:"c",h:"Critical",n:true,f:d=>shr(d.critical_share),sort:d=>d.critical_share}], D.breakdowns.safety_unstable_cells, {sortKey:"c"}), "Critical share above zero but below the finding threshold.", "", "c5")
   + sec("Points", `<div id="pt"></div>`, "", t?`R4 answers in cell ${esc(t)} × ${esc(s||"")}`:"R4") + `</div>`;
  let keys = KEYS.filter(k=>PTS[k].run==="R4");
  if(t){ const f=findings.find(x=>x.target===t&&x.surface===s); if(f) keys = f.pids; }
  pointTable(document.getElementById("pt"), keys, {sortKey:"dem", caption: t?`cell ${t} × ${s}`:"R4"});
}

// ---------------- map data on demand (the map block itself is untouched legacy code) ----------------
let mapPromise=null;
function openMapRoute(){
  if(window.__openMap){ window.__openMap(); return; }
  if(!mapPromise) mapPromise = loadScript("map_data.js").then(()=>{ window.__mapBoot(); });
  mapPromise.then(()=>{ if(location.hash.startsWith("#/map")) window.__openMap(); }).catch(e=>{ document.getElementById("view2").innerHTML=`<section class="tile">Neural map data (map_data.js) could not be loaded: ${esc(e.message)}</section>`; });
}
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error(src+" not found")); document.head.appendChild(sc); }); }

// ---------------- Level 3: point ----------------
const ANSWERS={}, ansPromise={};   // one gzip+base64 store per run: answers_R1.js … loaded only for the point's run
function loadAnswers(run){
  if(ansPromise[run]) return ansPromise[run];
  ansPromise[run] = loadScript("answers_"+run+".js").then(async()=>{ const b64=window["ANSWERS_B64_"+run]; const bin=Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); const ds=new DecompressionStream("gzip"); const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text(); Object.assign(ANSWERS, JSON.parse(text)); });
  return ansPromise[run];
}
function level3(el, key){
  const p = PTS[key]; if(!p){ el.innerHTML=`<section class="tile">Point ${esc(key)} not found.</section>`; return; }
  const list = window.__lastList || KEYS; const i = list.indexOf(key);
  const nav = `<div class="prevnext">${i>0?`<a href="#/point/${encodeURIComponent(list[i-1])}">← Previous</a>`:""}<a href="javascript:history.back()">Back</a>${i>=0&&i<list.length-1?`<a href="#/point/${encodeURIComponent(list[i+1])}">Next →</a>`:""}<span class="count">${i>=0?`${i+1} of ${list.length} in the current list`:""}</span></div>`;
  const m = p.metrics;
  const runspec = Object.entries(m.run_specific||{}).map(([k,v])=>[esc(k), esc(Object.entries(v).map(([a,b])=>`${a} ×${b}`).join(", "))]);
  el.innerHTML = nav + `<div class="kicker">${esc(p.pid)} · ${esc(p.run)} · ${esc(p.class)} · <a href="#/priorities?group=${encodeURIComponent(p.group_id)}" style="color:var(--us);text-decoration:none;text-transform:none;letter-spacing:0">${esc(p.group_id)}</a></div><h2 class="page">${esc(p.question)}</h2><div class="subline" style="margin-bottom:6px">${esc(p.zone)} · ${esc(p.topic)}${p.subtopic?` / ${esc(p.subtopic)}`:""} · ${esc(p.patient_stage)} · ${esc(p.query_type)}</div><div style="margin-bottom:16px"><span class="tag ${SEVTAG[p.sev]||"mute"}">${esc(p.sev)}</span> ${titleCause(p.code,p.code_label,p.cause)}${p.cause&&p.cause.evidence?`<ul class="evid note">${p.cause.evidence.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:""}</div>
  <div class="stack">
    ${sec("Metrics", `<div class="row top"><div><div class="mid">${m.we_present_share==null?"—":shr0(m.we_present_share)}<small>named</small></div></div><div><div class="mid">${f1(m.avg_position)}<small>position</small></div></div><div><div class="mid">${m.answers}<small>answers</small></div><div class="note">${m.answers_excluded} excluded</div></div></div>` + tbl([{k:"f",h:"Family",f:r=>esc(cap(r.model_family))},{k:"a",h:"Answers",n:true,f:r=>r.answers},{k:"w",h:"We present",n:true,f:r=>r.we_present},{k:"p",h:"Position",n:true,f:r=>f1(r.position)},{k:"bs",h:"Brand sentiment",n:true,f:r=>f1(r.brand_sentiment)},{k:"as",h:"Answer sentiment",n:true,f:r=>f1(r.answer_sentiment)}], m.by_model) + `<div></div>` + kv([["INN only",shr(m.inn_only_share)],["Rank score",f1(p.point_rank_score)],["Competitors present",Object.entries(m.competitors_present||{}).map(([k,v])=>`${esc(k)} ${v}`).join(", ")||"none"],["Citations",`${m.citations.total} · owned ${m.citations.owned} · earned ${m.citations.earned} · institutional ${m.citations.institutional} · competitor ${m.citations.competitor} · adversarial ${m.citations.adversarial}`],...runspec]), "", "from the pipeline", "c7")}
    ${sec("Sources", `<div class="srclist">${(m.citations.top_domains||[]).map(d=>`<a href="#/sources?domain=${encodeURIComponent(d.domain)}">${esc(d.domain)} <span>×${d.n} · ${esc(d.owner)}${d.subtype?"/"+esc(d.subtype):""}</span></a>`).join("")||"<span class='note'>no citations</span>"}</div>` + (p.serp?`<dl class="dl" style="margin-top:10px"><dt>Google</dt><dd>${p.serp.our?"we rank #"+p.serp.our:"we are absent"}; competitor ${p.serp.comp?"#"+p.serp.comp:"absent"}</dd><dt>Occupiers</dt><dd>${(p.serp.occ||[]).map(esc).join(", ")||"—"}</dd><dt>Overlap</dt><dd>${p.serp.ov??"—"}%</dd></dl>`:"") + (p.inventory?`<dl class="dl" style="margin-top:10px"><dt>Our page</dt><dd>${esc(p.inventory.v)}${p.inventory.url?` · <a href="${esc(p.inventory.url)}" target="_blank" rel="noopener">${esc(p.inventory.url)}</a>`:""}</dd><dt>Missing</dt><dd>${esc(p.inventory.miss||"—")}</dd></dl>`:""), "", "top domains, SERP snapshot, inventory", "c5")}
    ${sec("Diagnosis", `<div class="para">${(p.diagnosis_text||[]).map(s=>`<p>${esc(s)}</p>`).join("")}</div>`, "", "platform export", "c12")}
    ${sec("Demand", kv([["Topic demand /mo",fmtK(p.demand.topic_demand)],["Range",`${fmtK(p.demand.lo)}–${fmtK(p.demand.hi)}`],["Basis",esc(p.demand.basis)],["Prompt share",f1(p.demand_extra.prompt_share)],["AI-native",p.demand_extra.ai_native?"yes":"no"]]), "Prompt share and AI-native come from the platform export.", "", "c4")}
    ${sec("Evidence", `<ul class="evid">${(p.evidence_lines||[]).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`, "", "platform export", "c8")}
    ${sec("Answers", `<button class="btn ghost" id="loadAns" type="button">Load answers</button><div id="ansBox"></div>`, "Full texts from the corpus, loaded on demand. Excluded answers are flagged; their verdicts are not counted.", "one per model × repeat", "c12")}
    ${sec("Fix cards", p.fixes.filter(c=>c.audience==="client").map(c=>fixCard(c)).join("")||"<span class='note'>none</span>", "", "client", "c12")}
    <section class="tile c12"><button class="collapse" type="button" onclick="document.getElementById('cit2').classList.toggle('hide')">Citere monitoring (${p.fixes.filter(c=>c.audience==="citere").length} TRACK cards)</button><div id="cit2" class="hide">${p.fixes.filter(c=>c.audience==="citere").map(c=>fixCard(c)).join("")}</div></section>
  </div>`;
  document.getElementById("loadAns").onclick = async (ev) => {
    ev.target.textContent = "Loading…";
    let err=null; try{ await loadAnswers(p.run); }catch(e){ err=e; }
    const arr = ANSWERS[key] || [];
    document.getElementById("ansBox").innerHTML = arr.length ? arr.map(a=>`<div class="ans"><div class="ah" onclick="this.nextElementSibling.classList.toggle('hide')"><span class="who">${esc(a.model)}</span><span class="m">repeat ${a.repeat_idx}</span>${a.excluded?`<span class="tag bad">excluded · ${esc(a.exclude_reason)}</span>`:""}<span class="m">${a.citations.length} citations</span></div><div class="hide"><div class="ab">${esc(a.answer_clean)}</div><div class="cits">${a.citations.map(c=>`<a href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(c.owner)}">${esc(c.domain)}</a>`).join("")}</div></div></div>`).join("") : `<div class="note">No answer texts available (${err?esc(err.message):"key absent in answers_"+esc(p.run)+".js"}).</div>`;
    ev.target.textContent = `${arr.length} answers loaded`;
  };
}
